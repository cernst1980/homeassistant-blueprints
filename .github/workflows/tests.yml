name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install pytest pyyaml jinja2
      - name: YAML und Templates prüfen
        run: python3 tools/check_yaml.py
      - name: Tests
        run: python3 -m pytest tests -q
