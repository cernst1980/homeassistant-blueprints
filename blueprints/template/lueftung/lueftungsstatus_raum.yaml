blueprint:
  name: Lüftungsstatus pro Raum
  description: >-
    Liefert pro Raum einen Status-Sensor mit den Zuständen
    ok / lueften / dringend / offen / schliessen.
    Bewertet CO₂ (optional), absolute Feuchte innen/außen, Schimmelrisiko an der
    kältesten Wandstelle (gemessen oder über fRsi geschätzt), Feuchtespitzen
    (z. B. Duschen) und beim offenen Fenster die Wirksamkeit (Plateau-Erkennung).
  domain: template
  source_url: https://github.com/cernst1980/homeassistant-blueprints/blob/main/blueprints/template/lueftung/lueftungsstatus_raum.yaml
  input:
    raum:
      name: Raumname
      description: Anzeigename für Benachrichtigungen, z. B. "Bad"
      selector:
        text:

    sensoren:
      name: Sensoren
      input:
        temp_innen:
          name: Temperatur innen
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        feuchte_innen:
          name: Luftfeuchte innen
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity
        co2:
          name: CO₂ (optional)
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: carbon_dioxide
        fenster:
          name: Fensterkontakt (optional)
          description: >-
            Bei mehreren Fenstern eine Binärsensor-Gruppe ("beliebig an") verwenden.
            Leer lassen = Öffnen wird aus den Messwerten erkannt (siehe "Ohne Fensterkontakt").
          default: ""
          selector:
            entity:
              filter:
                - domain: binary_sensor
        temp_aussen:
          name: Temperatur außen
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature
        feuchte_aussen:
          name: Luftfeuchte außen
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity
        wand_temp:
          name: Temperatur kälteste Wandstelle (optional)
          description: Wenn leer, wird die Wandtemperatur über fRsi geschätzt.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature

        tmax_heute:
          name: Tageshöchsttemperatur laut Vorhersage (optional)
          description: Sensor aus der Beispielkonfiguration („Wetter Höchstwert heute“). Aktiviert Vorkühlen an Hitzetagen.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor

    aktivitaet:
      name: Aktivität, die Lüften erfordert (optional)
      collapsed: true
      input:
        aktivitaet:
          name: Entitäten
          description: >-
            z. B. Druckstatus von 3D-Druckern, Trockner, Dunstabzug. Aktiv, wenn eine davon einen
            der unten genannten Zustände hat.
          default: []
          selector:
            entity:
              multiple: true
        aktiv_zustaende:
          name: Als aktiv gelten die Zustände
          default: ["on", "running", "printing", "prepare", "pause"]
          selector:
            select:
              options: ["on", "running", "printing", "prepare", "pause", "heating", "slicing"]
              multiple: true
              custom_value: true
        aktivitaet_name:
          name: Bezeichnung in der Meldung
          default: Aktivität
          selector:
            text:
        aktivitaet_nachlauf:
          name: Nachlüften nach Ende (Min.)
          default: 15
          selector:
            number: { min: 0, max: 120, step: 5, unit_of_measurement: min, mode: box }

    sperre_gruppe:
      name: Lüften unterdrücken (optional)
      collapsed: true
      input:
        sperre:
          name: Während diese Entitäten aktiv sind, nicht zum Lüften auffordern
          description: z. B. Beamer/AV-Receiver im Heimkino (Lautstärke, Nachbarn).
          default: []
          selector:
            entity:
              multiple: true
        sperre_zustaende:
          name: Als aktiv gelten die Zustände
          default: ["on", "playing", "paused"]
          selector:
            select:
              options: ["on", "playing", "paused", "idle", "buffering"]
              multiple: true
              custom_value: true
        sperre_name:
          name: Bezeichnung in der Meldung
          default: Film
          selector:
            text:
        sperre_min:
          name: Danach lüften, wenn länger aktiv als (Min.)
          description: 0 = danach nicht gesondert zum Lüften auffordern.
          default: 30
          selector:
            number: { min: 0, max: 240, step: 5, unit_of_measurement: min, mode: box }
        temp_kuehlen:
          name: Temperatur für Kühlen/Hitze (optional)
          description: >-
            z. B. ein sonniger Wintergarten, der nicht in den Mittelwert der Zone einfließen soll,
            aber im Sommer zum Kühlen auffordern darf. Leer = Raumtemperatur.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature

    schwellen:
      name: Schwellwerte
      collapsed: true
      input:
        f_rsi:
          name: Temperaturfaktor fRsi
          description: 0,7 = Mindeststandard DIN 4108. Altbau/schlechte Ecken eher 0,6.
          default: 0.7
          selector:
            number: { min: 0.5, max: 0.95, step: 0.05, mode: box }
        co2_lueften:
          name: CO₂ lüften ab (ppm)
          default: 1000
          selector:
            number: { min: 600, max: 2000, step: 50, unit_of_measurement: ppm, mode: box }
        co2_dringend:
          name: CO₂ dringend ab (ppm)
          default: 1500
          selector:
            number: { min: 800, max: 3000, step: 50, unit_of_measurement: ppm, mode: box }
        co2_ziel:
          name: CO₂ Zielwert beim Lüften (ppm)
          default: 650
          selector:
            number: { min: 450, max: 1000, step: 25, unit_of_measurement: ppm, mode: box }
        rf_lueften:
          name: Wand-rF lüften ab (%)
          default: 70
          selector:
            number: { min: 55, max: 90, step: 1, unit_of_measurement: "%", mode: box }
        rf_dringend:
          name: Wand-rF dringend ab (%)
          default: 80
          selector:
            number: { min: 60, max: 95, step: 1, unit_of_measurement: "%", mode: box }
        ah_differenz:
          name: Mindestdifferenz absolute Feuchte (g/m³)
          description: So viel trockener muss die Außenluft sein, damit Lüften entfeuchtet.
          default: 1.0
          selector:
            number: { min: 0.3, max: 4, step: 0.1, unit_of_measurement: "g/m³", mode: box }
        dusch_anstieg:
          name: Feuchtespitze ab (% rF Anstieg in 10 Min.)
          default: 8
          selector:
            number: { min: 3, max: 30, step: 1, unit_of_measurement: "%", mode: box }
        max_abfall:
          name: Max. Temperaturabfall beim Lüften (K)
          default: 3
          selector:
            number: { min: 1, max: 8, step: 0.5, unit_of_measurement: K, mode: box }
        plateau_co2:
          name: Plateau CO₂ (ppm/Min.)
          description: Fällt CO₂ langsamer, gilt die Luft als ausgetauscht.
          default: 20
          selector:
            number: { min: 5, max: 100, step: 5, mode: box }
        plateau_ah:
          name: Plateau absolute Feuchte (g/m³ pro Min.)
          default: 0.1
          selector:
            number: { min: 0.02, max: 0.5, step: 0.01, mode: box }
        kuehlen_aktiv:
          name: Sommer-Kühlung empfehlen
          default: true
          selector:
            boolean:
        kuehlen_ab:
          name: Kühlen ab Innentemperatur (°C)
          default: 25
          selector:
            number: { min: 20, max: 30, step: 0.5, unit_of_measurement: "°C", mode: box }
        sommer_block:
          name: Sommer-Block (g/m³)
          description: >-
            Ist die Außenluft um so viel feuchter, wird normales CO₂-Lüften und Kühlen
            unterdrückt (Feuchteeintrag, v. a. Keller). „Dringend“ gilt weiterhin. 0 = aus.
          default: 2.0
          selector:
            number: { min: 0, max: 5, step: 0.1, unit_of_measurement: "g/m³", mode: box }
        rf_trocken:
          name: Schließen, wenn Raumluft zu trocken (% rF)
          description: Unterschreitet die rF innen beim Lüften diesen Wert, wird Schließen empfohlen.
          default: 35
          selector:
            number: { min: 20, max: 50, step: 1, unit_of_measurement: "%", mode: box }
        risiko_dringend_h:
          name: Schimmel – dringend ab (Feuchtestunden)
          description: >-
            Gleitende Summe der Stunden mit Wand-rF ≥ 80 % (75–80 % zählt halb), Abklingzeit ca. 3 Tage.
            Wand-rF ≥ „dringend“-Schwelle wird erst ab diesem Wert als dringend gemeldet.
          default: 12
          selector:
            number: { min: 0, max: 72, step: 1, unit_of_measurement: h, mode: box }
        risiko_hoch_h:
          name: Schimmel – Dauerbelastung ab (Feuchtestunden)
          description: Ab hier wird auch bei mäßiger Wand-rF zum Lüften geraten.
          default: 24
          selector:
            number: { min: 6, max: 120, step: 1, unit_of_measurement: h, mode: box }
        hitze_schwelle:
          name: Hitzetag ab Tageshöchstwert (°C)
          default: 28
          selector:
            number: { min: 24, max: 38, step: 1, unit_of_measurement: "°C", mode: box }
        hitze_vorkuehlen_ab:
          name: Vorkühlen an Hitzetagen ab Innentemperatur (°C)
          default: 21
          selector:
            number: { min: 16, max: 26, step: 0.5, unit_of_measurement: "°C", mode: box }
        grundlueftung_h:
          name: Grundlüftung spätestens alle (Std.)
          description: >-
            Nur für Zonen ohne (gültigen) CO₂-Wert: Wurde so lange nicht gelüftet, wird Lüften
            empfohlen. 0 = aus. Nicht bei deutlich wärmerer oder (Sommer-Block) feuchterer Außenluft.
          default: 8
          selector:
            number: { min: 0, max: 48, step: 1, unit_of_measurement: h, mode: box }
        grundlueftung_min:
          name: Als gelüftet zählt ab (Min. offen)
          description: Kürzeres Öffnen (z. B. Durchgang durch die Terrassentür) zählt nicht.
          default: 3
          selector:
            number: { min: 1, max: 30, step: 1, unit_of_measurement: min, mode: box }
        grundlueftung_ab:
          name: Grundlüftung erst ab (Uhrzeit)
          description: >-
            Vorher keine Grundlüftungs-Empfehlung, z. B. im Bad erst nach der üblichen Duschzeit
            (sonst ist das Bad zum Duschen ausgekühlt). 00:00 = keine Einschränkung.
          default: "00:00:00"
          selector:
            time:
        dauerlueften:
          name: Dauerlüften erlaubt
          description: >-
            Für kleine, lange genutzte Räume (Schlafzimmer, Büro): Fenster darf offen bleiben – keine
            Maximaldauer, kein Plateau, kein Abkühl-Limit. Schließen (oder kippen) nur, wenn der Raum zu kalt,
            die Außenluft deutlich feuchter oder wärmer bzw. die Raumluft zu trocken wird.
            „nachts“ = nur im Nachtfenster, danach in der Heizsaison „Nachtlüftung beendet“.
          default: aus
          selector:
            select:
              options: ["aus", "nachts", "immer"]
        nachtlueften:
          name: Nachts dauerhaft lüften erlaubt (veraltet)
          description: Entspricht „Dauerlüften = nachts“. Bitte stattdessen „Dauerlüften erlaubt“ verwenden.
          default: false
          selector:
            boolean:
        nacht_beginn:
          name: Nachtfenster von
          default: "21:00:00"
          selector:
            time:
        nacht_ende:
          name: Nachtfenster bis
          default: "07:00:00"
          selector:
            time:
        nacht_min_temp:
          name: Dauerlüften – schließen/kippen unter (°C)
          description: >-
            Kühlt der Raum stärker aus, steigt das Schimmelrisiko an Wänden und Laibungen.
            Schlafraum etwa 16 °C, Arbeitsraum 19 °C, Wohnraum 19–20 °C.
          default: 16
          selector:
            number: { min: 10, max: 20, step: 0.5, unit_of_measurement: "°C", mode: box }
        dauer_fenster:
          name: Dauerlüften nur bei diesen Fenstern (optional)
          description: >-
            z. B. nur das Küchenfenster beim Kochen. Leer = gilt für das Zonenfenster allgemein.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
        dauer_max_min:
          name: Dauerlüften höchstens (Min.)
          description: >-
            0 = unbegrenzt. z. B. 60 für „Küchenfenster beim Kochen“. Gilt nur in der Heizsaison
            (außen unter 18 °C) – im Sommer darf das Fenster beliebig lange offen bleiben.
          default: 0
          selector:
            number: { min: 0, max: 600, step: 5, unit_of_measurement: min, mode: box }
        dauer_fenster_warm:
          name: Dauerlüften bei warmem Wetter (optional)
          description: >-
            Fenster/Türen, die erst ab „Dauerlüften erst ab Außentemperatur“ offen bleiben dürfen,
            z. B. die Terrassentür, solange man draußen sitzt. Für sie ist „außen wärmer“ kein Grund zum Schließen.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
        dauer_ab_aussen:
          name: Dauerlüften erst ab Außentemperatur (°C)
          description: >-
            Darunter gelten die normalen Stoßlüft-Regeln (Heizverlust, kalte Laibungen bei Dauerkippen).
            Ohne Fensterlisten gilt das für die ganze Zone, sonst nur für „Dauerlüften bei warmem Wetter“.
            z. B. 16 für ein Arbeitszimmer. -30 = immer.
          default: -30
          selector:
            number: { min: -30, max: 18, step: 1, unit_of_measurement: "°C", mode: box }
        regengeschuetzt:
          name: Fenster ist regengeschützt
          description: z. B. Vordach oder Balkon darüber – keine Regenwarnung für diese Zone (Unwetter weiterhin).
          default: false
          selector:
            boolean:
        cooldown:
          name: Pause nach dem Lüften (Min.)
          description: So lange nach dem Schließen nur „dringend“ melden.
          default: 20
          selector:
            number: { min: 0, max: 120, step: 5, unit_of_measurement: min, mode: box }
        messintervall:
          name: Messintervall der Innensensoren (Min.)
          description: >-
            Wie oft die Sensoren messen (z. B. SwitchBot CO₂: 5). Das Vergleichsfenster für die
            Abfallraten wird automatisch länger gewählt, damit immer zwei echte Messungen verglichen werden.
          default: 1
          selector:
            number: { min: 1, max: 15, step: 1, unit_of_measurement: min, mode: box }
        max_alter:
          name: Sensorwert veraltet nach (Min.)
          description: >-
            Ohne neue Meldung in dieser Zeit wird der Wert ignoriert. Fehlen Pflichtwerte,
            wird der Raum „nicht verfügbar“. Viele Sensoren (BLE, Zigbee) melden nur bei
            Wertänderung – bei stabiler Raumluft kann das über eine Stunde dauern.
            Maßgeblich ist die letzte Meldung irgendeiner Entität desselben Geräts (bzw. der
            Gruppenmitglieder). Echte Ausfälle meldet die Integration meist selbst als „nicht verfügbar“.
          default: 180
          selector:
            number: { min: 10, max: 720, step: 10, unit_of_measurement: min, mode: box }
        annahme_zu:
          name: Ohne Fensterkontakt – als geschlossen annehmen nach (Min.)
          description: >-
            Nur für Räume ohne Kontakt: So lange nach "Fenster schließen" gilt das Fenster
            als geschlossen, falls es nicht vorher an steigender Temperatur erkannt wird.
          default: 10
          selector:
            number: { min: 2, max: 60, step: 1, unit_of_measurement: min, mode: box }

triggers:
  - trigger: time_pattern
    minutes: "/1"
  - trigger: homeassistant
    event: start

actions:
  - variables:
      raum: !input raum
      e_t_in: !input temp_innen
      e_rh_in: !input feuchte_innen
      e_co2: !input co2
      e_win: !input fenster
      e_t_out: !input temp_aussen
      e_rh_out: !input feuchte_aussen
      e_t_wand: !input wand_temp
      f_rsi: !input f_rsi
      co2_lueften: !input co2_lueften
      co2_dringend: !input co2_dringend
      co2_ziel: !input co2_ziel
      rf_lueften: !input rf_lueften
      rf_dringend: !input rf_dringend
      ah_min_diff: !input ah_differenz
      dusch_anstieg: !input dusch_anstieg
      max_abfall: !input max_abfall
      plateau_co2: !input plateau_co2
      plateau_ah: !input plateau_ah
      kuehlen_aktiv: !input kuehlen_aktiv
      kuehlen_ab: !input kuehlen_ab
      cooldown: !input cooldown
      max_alter: !input max_alter
      messintervall: !input messintervall
      annahme_zu: !input annahme_zu
      sommer_block: !input sommer_block
      rf_trocken: !input rf_trocken
      risiko_dringend_h: !input risiko_dringend_h
      risiko_hoch_h: !input risiko_hoch_h
      e_tmax: !input tmax_heute
      hitze_schwelle: !input hitze_schwelle
      hitze_vorkuehlen_ab: !input hitze_vorkuehlen_ab
      grundlueftung_h: !input grundlueftung_h
      grundlueftung_min: !input grundlueftung_min
      grundlueftung_ab: !input grundlueftung_ab
      nachtlueften: !input nachtlueften
      dauerlueften: !input dauerlueften
      dauer_fenster: !input dauer_fenster
      dauer_max_min: !input dauer_max_min
      dauer_ab_aussen: !input dauer_ab_aussen
      dauer_fenster_warm: !input dauer_fenster_warm
      e_sperre: !input sperre
      sperre_zustaende: !input sperre_zustaende
      sperre_name: !input sperre_name
      sperre_min: !input sperre_min
      e_t_kuehl: !input temp_kuehlen
      nacht_beginn: !input nacht_beginn
      nacht_ende: !input nacht_ende
      nacht_min_temp: !input nacht_min_temp
      regengeschuetzt: !input regengeschuetzt
      e_aktiv: !input aktivitaet
      aktiv_zustaende: !input aktiv_zustaende
      aktivitaet_name: !input aktivitaet_name
      aktivitaet_nachlauf: !input aktivitaet_nachlauf

  # Eigene Entity-ID: über `this`, sonst über das Attribut `raum`.
  # Vorherige Werte werden einzeln per state_attr() gelesen (nie als ganzes Dict).
  - variables:
      selbst: >-
        {%- if this is defined and this.entity_id is defined and this.entity_id is string -%}{{- this.entity_id -}}
        {%- else -%}
          {%- set k = states.sensor | selectattr('attributes.raum', 'defined')
                | selectattr('attributes.raum', 'eq', raum) | map(attribute='entity_id') | list -%}
          {{- k[0] if k | length > 0 else '' -}}
        {%- endif -%}

  # Zeitpunkt der letzten Sensormeldung (last_reported zählt auch unveränderte Werte)
  - variables:
      now_ts: "{{ as_timestamp(now()) | int }}"
      kontakt: "{{ e_win is string and e_win | length > 0 and states(e_win) not in ['unavailable', 'unknown'] }}"
      prev: "{{ states(selbst) if selbst else 'unknown' }}"
      ts_t_in: >-
        {%- set st = expand(e_t_in) | first if e_t_in else none -%}
        {{- (as_timestamp(st.last_reported | default(st.last_updated), 0) | int) if st else 0 -}}
      ts_rh_in: >-
        {%- set st = expand(e_rh_in) | first if e_rh_in else none -%}
        {{- (as_timestamp(st.last_reported | default(st.last_updated), 0) | int) if st else 0 -}}
      ts_co2: >-
        {%- set st = expand(e_co2) | first if e_co2 else none -%}
        {{- (as_timestamp(st.last_reported | default(st.last_updated), 0) | int) if st else 0 -}}
      ts_t_out: >-
        {%- set st = expand(e_t_out) | first if e_t_out else none -%}
        {{- (as_timestamp(st.last_reported | default(st.last_updated), 0) | int) if st else 0 -}}
      ts_rh_out: >-
        {%- set st = expand(e_rh_out) | first if e_rh_out else none -%}
        {{- (as_timestamp(st.last_reported | default(st.last_updated), 0) | int) if st else 0 -}}
      ts_t_wand: >-
        {%- set st = expand(e_t_wand) | first if e_t_wand else none -%}
        {{- (as_timestamp(st.last_reported | default(st.last_updated), 0) | int) if st else 0 -}}

  # Frische pro Sensor: letzte Meldung IRGENDEINER Entität desselben Geräts (bzw. der Gruppenmitglieder).
  # BLE-Integrationen schreiben eine Entität nur bei Wertänderung – konstante Feuchte ist kein Ausfall,
  # solange z. B. die Temperatur desselben Sensors weiter meldet.
  - variables:
      frisch: >-
        {%- set ns = namespace(s='') -%}
        {%- for key, ent in [('t_in', e_t_in), ('rh_in', e_rh_in), ('co2', e_co2), ('t_out', e_t_out),
              ('rh_out', e_rh_out), ('t_wand', e_t_wand)] -%}
          {%- set n2 = namespace(q=[], ts=0) -%}
          {%- if ent -%}
            {%- set basis = [ent] -%}
            {%- for attr in ['entity_id', 'quellen'] -%}
              {%- set m = state_attr(ent, attr) -%}
              {%- if m is iterable and m is not string and m is not mapping -%}{%- set basis = basis + (m | list) -%}{%- endif -%}
            {%- endfor -%}
            {%- for c in basis -%}
              {%- set d = device_id(c) -%}
              {%- set n2.q = n2.q + [c] + ((device_entities(d) | select('match', '(sensor|binary_sensor)[.]') | list) if d else []) -%}
            {%- endfor -%}
            {%- for st in expand(n2.q | unique | list) -%}
              {%- set t = as_timestamp(st.last_reported | default(st.last_updated), 0) -%}
              {%- if st.state not in ['unavailable', 'unknown'] and t > n2.ts -%}{%- set n2.ts = t -%}{%- endif -%}
            {%- endfor -%}
          {%- endif -%}
          {%- set ns.s = ns.s ~ "'" ~ key ~ "': " ~ (n2.ts | int) ~ ", " -%}
        {%- endfor -%}
        {{- '{' ~ ns.s ~ '}' -}}

  - variables:
      grenze: "{{ now_ts - (max_alter | int) * 60 }}"
      # Vergleichsfenster für Raten: mind. 3 Min., sonst Messintervall + 2 Min.
      ref_alter: "{{ ([3, (messintervall | int(1)) + 2] | max) * 60 }}"

  # Rohwerte (veraltete Werte werden zu none)
  - variables:
      # zusätzlich Plausibilitätsgrenzen (Sensorfehler wie 0 % rF oder -40 °C)
      t_in: >-
        {%- set v = states(e_t_in) | float(none) -%}
        {{- v if (frisch.t_in >= grenze and v is number and -10 <= v <= 50) else none -}}
      rh_in: >-
        {%- set v = states(e_rh_in) | float(none) -%}
        {{- v if (frisch.rh_in >= grenze and v is number and 1 <= v <= 100) else none -}}
      t_out: >-
        {%- set v = states(e_t_out) | float(none) -%}
        {{- v if (frisch.t_out >= grenze and v is number and -40 <= v <= 50) else none -}}
      rh_out: >-
        {%- set v = states(e_rh_out) | float(none) -%}
        {{- v if (frisch.rh_out >= grenze and v is number and 1 <= v <= 100) else none -}}
      co2: >-
        {%- set v = (states(e_co2) | float(none)) if e_co2 else none -%}
        {{- v if (e_co2 and frisch.co2 >= grenze and v is number and 300 <= v <= 10000) else none -}}
      t_wand_sensor: >-
        {%- set v = (states(e_t_wand) | float(none)) if e_t_wand else none -%}
        {{- v if (e_t_wand and frisch.t_wand >= grenze and v is number and -20 <= v <= 50) else none -}}
      tmax: "{{ (states(e_tmax) | float(none)) if e_tmax else none }}"
      veraltet: >-
        {%- set ns = namespace(l=[]) -%}
        {%- for name, ent, ts in [('Temperatur innen', e_t_in, frisch.t_in), ('Feuchte innen', e_rh_in, frisch.rh_in),
              ('CO₂', e_co2, frisch.co2), ('Temperatur außen', e_t_out, frisch.t_out),
              ('Feuchte außen', e_rh_out, frisch.rh_out), ('Wandtemperatur', e_t_wand, frisch.t_wand)]
              if ent and ts < grenze -%}
          {%- set ns.l = ns.l + [name] -%}
        {%- endfor -%}
        {{- ns.l -}}

  # Sensorprobleme (inkl. Mitglieder von Gruppen / Quellen von Rückfall-Sensoren)
  - variables:
      sensorprobleme: >-
        {%- set ns = namespace(l=[]) -%}
        {%- for name, ent in [('Temperatur innen', e_t_in), ('Feuchte innen', e_rh_in), ('CO₂', e_co2),
              ('Temperatur außen', e_t_out), ('Feuchte außen', e_rh_out), ('Wandtemperatur', e_t_wand),
              ('Fensterkontakt', e_win)] if ent -%}
          {%- set quellen = state_attr(ent, 'entity_id') or state_attr(ent, 'quellen') -%}
          {%- if quellen is iterable and quellen is not string -%}
            {%- for m in quellen if states(m) in ['unavailable', 'unknown'] -%}
              {%- set ns.l = ns.l + [name ~ ': ' ~ (state_attr(m, 'friendly_name') or m) ~ ' (nicht verfügbar)'] -%}
            {%- endfor -%}
          {%- endif -%}
          {%- if states(ent) in ['unavailable', 'unknown'] -%}
            {%- set ns.l = ns.l + [name ~ ': ' ~ (state_attr(ent, 'friendly_name') or ent) ~ ' (nicht verfügbar)'] -%}
          {%- elif name in veraltet -%}
            {%- set ns.l = ns.l + [name ~ ': ' ~ (state_attr(ent, 'friendly_name') or ent) ~ ' (keine Meldung seit ' ~ max_alter ~ ' Min.)'] -%}
          {%- endif -%}
        {%- endfor -%}
        {{- ns.l -}}
      einschraenkungen: >-
        {%- set l = [] -%}
        {%- if e_co2 and co2 is not number -%}{%- set l = l + ['CO₂-Bewertung'] -%}{%- endif -%}
        {%- if not (t_in is number and rh_in is number and t_out is number and rh_out is number) -%}
          {%- set l = l + ['Feuchte-/Schimmelbewertung'] -%}{%- endif -%}
        {%- if not (t_in is number and t_out is number) -%}{%- set l = l + ['Kühlen/Hitze'] -%}{%- endif -%}
        {%- if e_win and not kontakt -%}{%- set l = l + ['Fensterkontakt (Öffnen wird geschätzt)'] -%}{%- endif -%}
        {{- l -}}
      keine_daten: "{{ t_in is not number and rh_in is not number and co2 is not number }}"

  # Absolute Feuchte (Magnus) und Wandtemperatur
  - variables:
      ah_in: >-
        {%- if t_in is number and rh_in is number -%}
        {{- (6.112 * e ** (17.67 * t_in / (t_in + 243.5)) * rh_in * 2.1674 / (273.15 + t_in)) | round(2) -}}
        {%- else -%}{{- none -}}{%- endif -%}
      ah_out: >-
        {%- if t_out is number and rh_out is number -%}
        {{- (6.112 * e ** (17.67 * t_out / (t_out + 243.5)) * rh_out * 2.1674 / (273.15 + t_out)) | round(2) -}}
        {%- else -%}{{- none -}}{%- endif -%}
      t_wand: >-
        {%- if t_wand_sensor is number -%}{{- t_wand_sensor -}}
        {%- elif t_in is number and t_out is number -%}{{- (t_out + f_rsi * (t_in - t_out)) | round(1) -}}
        {%- else -%}{{- none -}}{%- endif -%}

  # Wand-rF und Verlauf (letzte 10 Min.)
  - variables:
      rf_wand: >-
        {%- if ah_in is number and t_wand is number -%}
        {%- set sat = 6.112 * e ** (17.67 * t_wand / (t_wand + 243.5)) -%}
        {{- ([ah_in * (273.15 + t_wand) / (2.1674 * sat), 100] | min) | round(1) -}}
        {%- else -%}{{- none -}}{%- endif -%}
      verlauf: >-
        {%- set alt = ((state_attr(selbst, 'verlauf') if selbst else none) or []) -%}
        {%- set alt = alt if (alt is iterable and alt is not string and alt is not mapping) else [] -%}
        {%- set neu = (alt | selectattr('t', 'gt', now_ts - ([600, ref_alter + 300] | max)) | list)
              + [{'t': now_ts, 'co2': (co2 | int) if co2 is number else none, 'rh': rh_in, 'ah': ah_in, 'ti': t_in, 'tc': ts_co2, 'th': ts_rh_in}] -%}
        {{- neu[-20:] -}}

  # Trends (Referenz: letzter Messpunkt, der mind. 3 Min. alt ist)
  - variables:
      # Schimmel-Index: gleitende Feuchtestunden, exponentiell abklingend (τ = 72 h)
      schimmel_h: >-
        {%- set alt = ((state_attr(selbst, 'schimmel_stunden') if selbst else none) or 0) -%}
        {%- set alt = alt if alt is number else 0 -%}
        {%- set last = (state_attr(selbst, 'schimmel_ts') if selbst else none) -%}
        {%- set dt = ([now_ts - last, 3600] | min) if (last is number and now_ts > last) else 60 -%}
        {%- set w = 1 if (rf_wand is number and rf_wand >= 80) else (0.5 if (rf_wand is number and rf_wand >= 75) else 0) -%}
        {{- (alt * e ** (0 - dt / 259200) + w * dt / 3600) | round(3) -}}
      hitzetag: "{{ tmax is number and tmax >= hitze_schwelle }}"
      ref: >-
        {%- set r = verlauf | selectattr('t', 'le', now_ts - ref_alter) | list -%}
        {{- r[-1] if r | length > 0 else none -}}
      rf_anstieg: >-
        {%- set werte = verlauf | map(attribute='rh') | select('number') | list -%}
        {{- ((rh_in - (werte | min)) | round(1)) if (werte | length > 0 and rh_in is number) else 0 -}}

  - variables:
      co2_abfall: >-
        {%- if ref is mapping and co2 is number and ref.co2 is number and now_ts > ref.t -%}
        {{- ((ref.co2 - co2) / ((now_ts - ref.t) / 60)) | round(1) -}}
        {%- else -%}{{- none -}}{%- endif -%}
      ah_abfall: >-
        {%- if ref is mapping and ah_in is number and ref.ah is number and now_ts > ref.t -%}
        {{- ((ref.ah - ah_in) / ((now_ts - ref.t) / 60)) | round(3) -}}
        {%- else -%}{{- none -}}{%- endif -%}
      t_abfall: >-
        {%- if ref is mapping and t_in is number and ref.ti is number and now_ts > ref.t -%}
        {{- ((ref.ti - t_in) / ((now_ts - ref.t) / 60)) | round(2) -}}
        {%- else -%}{{- none -}}{%- endif -%}

  # Fensterzustand: Kontakt, oder ohne Kontakt aus den Messwerten geschätzt
  - variables:
      oeffnung_erkannt: >-
        {%- set t_ok = t_abfall is number and t_in is number and t_out is number
              and (t_in - t_out) >= 5 and t_abfall >= 0.25 -%}
        {%- set c_ok = co2_abfall is number and co2_abfall >= 40 -%}
        {%- set h_ok = ah_abfall is number and ah_abfall >= 0.15 -%}
        {{- prev in ['lueften', 'dringend'] and (t_ok or c_ok or h_ok) -}}
      win_open: >-
        {%- if kontakt -%}{{- is_state(e_win, 'on') -}}
        {%- elif ((state_attr(selbst, 'vermutet_offen') if selbst else none) or false) -%}
          {%- set ss = (state_attr(selbst, 'schliessen_seit') if selbst else none) -%}
          {%- set os = (state_attr(selbst, 'offen_seit') if selbst else none) -%}
          {%- set tmin = (state_attr(selbst, 't_min_offen') if selbst else none) -%}
          {%- set zu = (ss is number and now_ts - ss >= (annahme_zu | int) * 60)
                or (os is number and now_ts - os >= 3600)
                or (tmin is number and t_in is number and t_in - tmin >= 0.5) -%}
          {{- not zu -}}
        {%- else -%}{{- oeffnung_erkannt -}}{%- endif -%}

  - variables:
      offen_seit: >-
        {%- set alt = (state_attr(selbst, 'offen_seit') if selbst else none) -%}
        {%- if not win_open -%}{{- none -}}
        {%- elif alt is number -%}{{- alt -}}
        {%- elif kontakt -%}{{- as_timestamp((expand(e_win) | first).last_changed, now_ts) | int -}}
        {%- else -%}{{- now_ts - 180 -}}{%- endif -%}
      geschlossen_seit: >-
        {%- set alt_offen = (state_attr(selbst, 'offen_seit') if selbst else none) -%}
        {#- Pause nur nach echtem Lüften (mind. grundlueftung_min offen), nicht nach einem Durchgang -#}
        {%- set war_offen = alt_offen is number and (now_ts - alt_offen) >= (grundlueftung_min | float(3)) * 60 -%}
        {%- set alt = (state_attr(selbst, 'geschlossen_seit') if selbst else none) -%}
        {%- if win_open -%}{{- none -}}
        {%- elif war_offen -%}{{- (as_timestamp((expand(e_win) | first).last_changed, now_ts) | int) if kontakt else now_ts -}}
        {%- elif alt is number and now_ts - alt < (cooldown | int) * 60 -%}{{- alt -}}
        {%- else -%}{{- none -}}{%- endif -%}

  - variables:
      temp_bei_oeffnung: >-
        {%- set alt = (state_attr(selbst, 'temp_bei_oeffnung') if selbst else none) -%}
        {%- if not win_open -%}{{- none -}}
        {%- elif alt is number -%}{{- alt -}}
        {%- else -%}
          {%- set vor = verlauf | selectattr('t', 'le', offen_seit) | map(attribute='ti') | select('number') | list -%}
          {{- vor[-1] if vor | length > 0 else t_in -}}
        {%- endif -%}
      t_min_offen: >-
        {%- set alt = (state_attr(selbst, 't_min_offen') if selbst else none) -%}
        {%- if not win_open or t_in is not number -%}{{- none if not win_open else alt -}}
        {%- elif alt is number -%}{{- [alt, t_in] | min -}}
        {%- else -%}{{- t_in -}}{%- endif -%}
      offen_min: "{{ ((now_ts - offen_seit) / 60) | round(1) if offen_seit is number else 0 }}"
      max_min: >-
        {%- if t_out is not number -%}10
        {%- elif t_out < 0 -%}5
        {%- elif t_out < 10 -%}10
        {%- elif t_out < 18 -%}15
        {%- else -%}0{%- endif -%}

  # Aktivität (z. B. 3D-Druck) und Nachlauf
  - variables:
      aktiv_jetzt: >-
        {%- set liste = e_aktiv if (e_aktiv is iterable and e_aktiv is not string) else ([e_aktiv] if e_aktiv else []) -%}
        {%- set z = aktiv_zustaende if (aktiv_zustaende is iterable and aktiv_zustaende is not string) else [aktiv_zustaende] -%}
        {{- liste | select('is_state', z) | list | count > 0 -}}
      aktiv_zuletzt: >-
        {%- set alt = (state_attr(selbst, 'aktiv_zuletzt') if selbst else none) -%}
        {%- if aktiv_jetzt -%}{{- now_ts -}}{%- elif alt is number -%}{{- alt -}}{%- else -%}{{- none -}}{%- endif -%}
      aktiv_nachlauf: >-
        {{- (not aktiv_jetzt) and aktiv_zuletzt is number and (now_ts - aktiv_zuletzt) < (aktivitaet_nachlauf | int(0)) * 60 -}}

  # Letzte echte Lüftung (Fenster mind. grundlueftung_min offen). Erster Lauf: jetzt.
  - variables:
      zuletzt_gelueftet: >-
        {%- set alt = (state_attr(selbst, 'zuletzt_gelueftet') if selbst else none) -%}
        {%- set alt_offen = (state_attr(selbst, 'offen_seit') if selbst else none) -%}
        {%- set schliesszeit = (as_timestamp((expand(e_win) | first).last_changed, now_ts) | int) if kontakt else now_ts -%}
        {%- if win_open and offen_min >= (grundlueftung_min | float(3)) -%}{{- now_ts -}}
        {#- Gerade geschlossen: tatsächliche Öffnungsdauer prüfen (Lauf kann zwischen 3 Min. und Schließen fallen) -#}
        {%- elif not win_open and alt_offen is number and (schliesszeit - alt_offen) >= (grundlueftung_min | float(3)) * 60 -%}{{- schliesszeit -}}
        {%- elif alt is number -%}{{- alt -}}
        {%- else -%}{{- now_ts -}}{%- endif -%}

  # Plateau-Absicherung: seit dem Öffnen mind. zwei verschiedene Sensormeldungen
  - variables:
      co2_rate_gueltig: >-
        {%- if co2_abfall is number and offen_seit is number -%}
          {%- set neu = verlauf | map(attribute='tc') | select('number') | select('gt', offen_seit) | unique | list -%}
          {{- neu | length >= 2 -}}
        {%- else -%}{{- false -}}{%- endif -%}
      ah_rate_gueltig: >-
        {%- if ah_abfall is number and offen_seit is number -%}
          {%- set neu = verlauf | map(attribute='th') | select('number') | select('gt', offen_seit) | unique | list -%}
          {{- neu | length >= 2 -}}
        {%- else -%}{{- false -}}{%- endif -%}

  # Nachtlüftung
  - variables:
      modus: "{{ dauerlueften if dauerlueften in ['nachts', 'immer'] else ('nachts' if nachtlueften else 'aus') }}"
      nacht: >-
        {%- set n = now().strftime('%H:%M:%S') -%}
        {%- set b = nacht_beginn | string -%}
        {%- set e = nacht_ende | string -%}
        {%- if modus != 'nachts' -%}{{- false -}}
        {%- elif b > e -%}{{- n >= b or n < e -}}
        {%- elif b < e -%}{{- n >= b and n < e -}}
        {%- else -%}{{- false -}}{%- endif -%}
      dauer_vorher: "{{ (state_attr(selbst, 'dauer') if selbst else false) is true }}"
      nacht_ende_ts: >-
        {%- set e = as_timestamp(today_at(nacht_ende | string)) | int -%}
        {{- e if e <= now_ts else e - 86400 -}}
      nachtlueftung_beendet: >-
        {{- modus == 'nachts' and not nacht and win_open and offen_seit is number and offen_seit < nacht_ende_ts -}}
      dauer: >-
        {%- set df = dauer_fenster if (dauer_fenster is iterable and dauer_fenster is not string) else ([dauer_fenster] if dauer_fenster else []) -%}
        {%- set dw = dauer_fenster_warm if (dauer_fenster_warm is iterable and dauer_fenster_warm is not string) else ([dauer_fenster_warm] if dauer_fenster_warm else []) -%}
        {%- set ab = (dauer_ab_aussen | float(-30)) - (1 if dauer_vorher else 0) -%}
        {%- set warm = ab <= -30 or t_out is not number or t_out >= ab -%}
        {%- if df | count == 0 and dw | count == 0 -%}
          {%- set fenster_ok = warm -%}
        {%- else -%}
          {#- erlaubt: dauer_fenster immer, dauer_fenster_warm nur ab dauer_ab_aussen.
              Bei Fenstergruppen müssen alle offenen Mitglieder erlaubt sein. -#}
          {%- set erlaubt = df + (dw if warm else []) -%}
          {%- set mitglieder = (state_attr(e_win, 'entity_id') if e_win else none) or [] -%}
          {%- set mitglieder = mitglieder if (mitglieder is iterable and mitglieder is not string) else [] -%}
          {%- set offen = mitglieder | select('is_state', 'on') | list -%}
          {%- set fenster_ok = (erlaubt | select('is_state', 'on') | list | count > 0)
                and (offen | reject('in', erlaubt) | list | count == 0) -%}
        {%- endif -%}
        {{- (modus == 'immer' or nacht) and fenster_ok -}}
      # Durchgangstür (z. B. Terrasse) offen: „außen wärmer“ ist kein Grund zum Schließen
      durchgang_offen: >-
        {%- set dw = dauer_fenster_warm if (dauer_fenster_warm is iterable and dauer_fenster_warm is not string) else ([dauer_fenster_warm] if dauer_fenster_warm else []) -%}
        {{- dauer and dw | select('is_state', 'on') | list | count > 0 -}}
      t_kuehl: >-
        {%- set v = (states(e_t_kuehl) | float(none)) if e_t_kuehl else none -%}
        {{- v if (v is number and -10 <= v <= 60) else t_in -}}
      sperre_aktiv: >-
        {%- set l = e_sperre if (e_sperre is iterable and e_sperre is not string) else ([e_sperre] if e_sperre else []) -%}
        {%- set z = sperre_zustaende if (sperre_zustaende is iterable and sperre_zustaende is not string) else [sperre_zustaende] -%}
        {{- l | select('is_state', z) | list | count > 0 -}}
      sperre_beginn: >-
        {%- set alt = (state_attr(selbst, 'sperre_beginn') if selbst else none) -%}
        {%- set war = (state_attr(selbst, 'sperre_aktiv') if selbst else false) is true -%}
        {%- set ende_alt = (state_attr(selbst, 'sperre_ende') if selbst else none) -%}
        {#- kurze Unterbrechung (z. B. zwischen zwei Folgen) zählt als eine Sperre -#}
        {%- if sperre_aktiv and not war -%}{{- alt if (alt is number and ende_alt is number and now_ts - ende_alt < 900) else now_ts -}}
        {%- elif alt is number -%}{{- alt -}}{%- else -%}{{- none -}}{%- endif -%}
      sperre_ende: >-
        {%- set alt = (state_attr(selbst, 'sperre_ende') if selbst else none) -%}
        {%- set war = (state_attr(selbst, 'sperre_aktiv') if selbst else false) is true -%}
        {%- if sperre_aktiv -%}{{- none -}}
        {%- elif war -%}{{- now_ts -}}
        {%- elif alt is number -%}{{- alt -}}{%- else -%}{{- none -}}{%- endif -%}
      nach_sperre: >-
        {{- (sperre_min | int(0)) > 0 and not sperre_aktiv and sperre_ende is number and sperre_beginn is number
            and (sperre_ende - sperre_beginn) >= (sperre_min | int(0)) * 60
            and now_ts - sperre_ende < 43200
            and (zuletzt_gelueftet is not number or zuletzt_gelueftet < sperre_ende) -}}

  # Entscheidung
  - variables:
      ergebnis: >-
        {%- set ns = namespace(dringend=false, gruende=[]) -%}
        {%- set hyst = prev in ['lueften', 'dringend'] -%}
        {%- set ah_diff = (ah_in - ah_out) if (ah_in is number and ah_out is number) else none -%}
        {%- set trocken = ah_diff is number and ah_diff >= (ah_min_diff - (0.3 if hyst else 0)) -%}
        {%- set blockiert = (sommer_block | float(0)) > 0 and ah_diff is number and ah_diff <= 0 - (sommer_block | float(0)) -%}
        {%- set kuehl_ab = hitze_vorkuehlen_ab if hitzetag else kuehlen_ab -%}
        {#- Eigener Kühl-Sensor (z. B. Wintergarten) zählt nur, wenn auch die Zone warm ist –
            sonst ist die Sonnenwärme willkommen (Heizsaison) -#}
        {%- set kuehlen = kuehlen_aktiv and t_kuehl is number and t_in is number and t_out is number
              and t_kuehl >= kuehl_ab and t_in >= kuehl_ab - (2 if e_t_kuehl else 0) and t_out <= t_in - 2
              and (ah_diff is not number or ah_diff > 0 - ah_min_diff) -%}
        {%- if not win_open -%}
          {%- if co2 is number -%}
            {%- if co2 >= co2_dringend -%}
              {%- set ns.dringend = true -%}
              {%- set ns.gruende = ns.gruende + ['CO₂ ' ~ (co2 | int) ~ ' ppm'] -%}
            {%- elif co2 >= co2_lueften - (150 if hyst else 0) and not blockiert -%}
              {%- set ns.gruende = ns.gruende + ['CO₂ ' ~ (co2 | int) ~ ' ppm'] -%}
            {%- endif -%}
          {%- endif -%}
          {%- if trocken and rf_wand is number -%}
            {%- set info = ' (außen ' ~ (ah_diff | round(1)) ~ ' g/m³ trockener)' -%}
            {%- set fh = ' · ' ~ (schimmel_h | round(0) | int) ~ ' Feuchtestunden' -%}
            {%- if rf_wand >= rf_dringend and schimmel_h >= risiko_dringend_h -%}
              {%- set ns.dringend = true -%}
              {%- set ns.gruende = ns.gruende + ['Schimmelrisiko, Wand ' ~ rf_wand ~ ' % rF' ~ fh ~ info] -%}
            {%- elif schimmel_h >= risiko_hoch_h and rf_wand >= rf_lueften - 10 -%}
              {%- set ns.gruende = ns.gruende + ['Dauerhaft zu feucht, Wand ' ~ rf_wand ~ ' % rF' ~ fh ~ info] -%}
            {%- elif rf_wand >= rf_dringend -%}
              {%- set ns.gruende = ns.gruende + ['Feuchte, Wand ' ~ rf_wand ~ ' % rF' ~ info] -%}
            {%- elif rf_wand >= rf_lueften - (5 if hyst else 0) and rh_in >= rf_trocken + 10 -%}
              {%- set ns.gruende = ns.gruende + ['Feuchte, Wand ' ~ rf_wand ~ ' % rF' ~ info] -%}
            {%- endif -%}
          {%- endif -%}
          {%- if trocken and rf_anstieg >= dusch_anstieg -%}
            {%- set ns.dringend = true -%}
            {%- set ns.gruende = ns.gruende + ['Feuchtespitze +' ~ rf_anstieg ~ ' % rF'] -%}
          {%- endif -%}
          {%- if kuehlen -%}
            {%- set ns.gruende = ns.gruende + ['Kühlen, außen ' ~ t_out ~ ' °C' ~ ((' – heute bis ' ~ (tmax | round(0) | int) ~ ' °C') if hitzetag else '')] -%}
          {%- endif -%}
          {%- set seit_h = ((now_ts - zuletzt_gelueftet) / 3600) if zuletzt_gelueftet is number else 0 -%}
          {%- if (grundlueftung_h | float(0)) > 0 and co2 is not number and not blockiert
                and now().strftime('%H:%M:%S') >= (grundlueftung_ab | string)
                and not (ah_diff is number and ah_diff < 0 - ah_min_diff)
                and seit_h >= (grundlueftung_h | float(0))
                and (t_in is not number or t_out is not number or t_out <= t_in + 1) -%}
            {%- set ns.gruende = ns.gruende + ['Grundlüftung, seit ' ~ (seit_h | round(0) | int) ~ ' h nicht gelüftet'] -%}
          {%- endif -%}
          {#- Aktivität: Schadstoffe, die kein Sensor misst → auch bei feuchter Außenluft -#}
          {%- if aktiv_jetzt -%}
            {%- set ns.gruende = ns.gruende + [aktivitaet_name ~ ' läuft'] -%}
          {%- elif aktiv_nachlauf -%}
            {%- set ns.gruende = ns.gruende + ['Nachlüften nach ' ~ aktivitaet_name] -%}
          {%- endif -%}
          {%- if nach_sperre -%}
            {%- set ns.gruende = ns.gruende + ['Nach ' ~ sperre_name ~ ' lüften'] -%}
          {%- endif -%}
          {%- set rest = ((cooldown | int) * 60 - (now_ts - geschlossen_seit)) if geschlossen_seit is number else 0 -%}
          {%- if sperre_aktiv and ns.gruende | length > 0 -%}
            {%- set status = 'ok' -%}
            {%- set ns.gruende = ['Lüften pausiert (' ~ sperre_name ~ ')'] -%}
          {%- elif rest > 0 and not ns.dringend and ns.gruende | length > 0 -%}
            {%- set status = 'ok' -%}
            {%- set ns.gruende = ['Pause nach dem Lüften, noch ' ~ ((rest / 60) | round(0, 'ceil') | int) ~ ' Min.'] -%}
          {%- else -%}
            {%- set status = 'ok' if ns.gruende | length == 0 else ('dringend' if ns.dringend else 'lueften') -%}
          {%- endif -%}
        {%- else -%}
          {%- if prev == 'schliessen' and not dauer -%}
            {%- set ns.gruende = [((state_attr(selbst, 'grund') if selbst else none) or '')] -%}
          {%- elif dauer -%}
            {#- Dauerlüften: offen bleiben erlaubt, nur echte Gründe zum Schließen/Kippen.
                Wird jede Minute neu bewertet (Kontakt erkennt „gekippt“ nicht) – mit Hysterese. -#}
            {%- set h = prev == 'schliessen' -%}
            {%- if t_in is number and t_in < (nacht_min_temp | float(16)) + (0.5 if h else 0) -%}
              {%- set ns.gruende = ns.gruende + ['Raum zu kalt (' ~ t_in ~ ' °C)'] -%}
            {%- endif -%}
            {%- if (dauer_max_min | int(0)) > 0 and max_min > 0 and offen_min >= (dauer_max_min | int(0)) -%}
              {%- set ns.gruende = ns.gruende + ['seit ' ~ (offen_min | int) ~ ' Min. offen'] -%}
            {%- endif -%}
            {%- if (sommer_block | float(0)) > 0 and offen_min >= 2 and ah_diff is number
                  and ah_diff <= 0 - (sommer_block | float(0)) + (0.3 if h else 0) -%}
              {%- set ns.gruende = ns.gruende + ['Außenluft deutlich feuchter'] -%}
            {%- endif -%}
            {%- if offen_min >= 2 and rh_in is number and rh_in < rf_trocken + (2 if h else 0) -%}
              {%- set ns.gruende = ns.gruende + ['Raumluft wird zu trocken (' ~ rh_in ~ ' % rF)'] -%}
            {%- endif -%}
            {%- if kuehlen_aktiv and not durchgang_offen and offen_min >= 2 and t_in is number and t_out is number
                  and t_out >= t_in + (0.5 if h else 1) -%}
              {%- set ns.gruende = ns.gruende + ['außen wärmer als innen'] -%}
            {%- endif -%}
          {%- elif nachtlueftung_beendet and max_min > 0 -%}
            {%- set ns.gruende = ['Nachtlüftung beendet'] -%}
          {%- else -%}
            {%- set co2_hoch = co2 is number and co2 >= co2_lueften -%}
            {%- set co2_ok = co2 is not number or co2 <= co2_ziel
                  or (co2_rate_gueltig and co2_abfall < plateau_co2) -%}
            {%- set ah_ok = ah_diff is not number or ah_diff < 0.5
                  or (ah_rate_gueltig and ah_abfall < plateau_ah) -%}
            {%- if hitzetag and not co2_hoch and offen_min >= 2 and t_in is number and t_in < hitze_vorkuehlen_ab -%}
              {%- set ns.gruende = ns.gruende + ['Raum vorgekühlt (' ~ t_in ~ ' °C)'] -%}
            {%- endif -%}
            {#- max_min 0 = ab 18 °C außen keine Maximaldauer (kein Heizverlust, Dauerlüften ok) -#}
            {%- if not kuehlen and max_min > 0 and offen_min >= max_min -%}
              {%- set ns.gruende = ns.gruende + ['seit ' ~ (offen_min | int) ~ ' Min. offen'] -%}
            {%- endif -%}
            {%- if not kuehlen and t_in is number and temp_bei_oeffnung is number
                  and t_in <= temp_bei_oeffnung - max_abfall -%}
              {%- set ns.gruende = ns.gruende + ['Raum um ' ~ ((temp_bei_oeffnung - t_in) | round(1)) ~ ' K abgekühlt'] -%}
            {%- endif -%}
            {%- if not kuehlen and not co2_hoch and offen_min >= 2
                  and ah_diff is number and ah_diff < 0 - ah_min_diff -%}
              {%- set ns.gruende = ns.gruende + ['Außenluft ist feuchter'] -%}
            {%- endif -%}
            {%- if not co2_hoch and offen_min >= 2 and rh_in is number and rh_in < rf_trocken -%}
              {%- set ns.gruende = ns.gruende + ['Raumluft wird zu trocken (' ~ rh_in ~ ' % rF)'] -%}
            {%- endif -%}
            {%- if kuehlen_aktiv and not co2_hoch and offen_min >= 2
                  and t_in is number and t_out is number and t_out >= t_in -%}
              {%- set ns.gruende = ns.gruende + ['außen wärmer als innen'] -%}
            {%- endif -%}
            {#- Plateau nur in der Heizsaison: ohne Heizverlust (max_min 0) kein Grund zum Schließen -#}
            {%- if not kuehlen and not aktiv_jetzt and not aktiv_nachlauf and max_min > 0 and offen_min >= (ref_alter / 60 + 1) and co2_ok and ah_ok -%}
              {%- set ns.gruende = ns.gruende + ['Luft ist ausgetauscht'] -%}
            {%- endif -%}
          {%- endif -%}
          {%- set status = 'schliessen' if ns.gruende | length > 0 else 'offen' -%}
        {%- endif -%}
        {{- {'status': status, 'grund': ns.gruende | join(' · ')} -}}

  - variables:
      schliessen_seit: >-
        {%- if ergebnis.status != 'schliessen' -%}{{- none -}}
        {%- elif prev == 'schliessen' and (state_attr(selbst, 'schliessen_seit') if selbst else none) is number -%}{{- (state_attr(selbst, 'schliessen_seit') if selbst else none) -}}
        {%- else -%}{{- now_ts -}}{%- endif -%}

sensor:
  state: "{{ 'keine_daten' if keine_daten else ergebnis.status }}"
  icon: >-
    {{ {'ok': 'mdi:check-circle-outline',
        'lueften': 'mdi:weather-windy',
        'dringend': 'mdi:alert-circle-outline',
        'offen': 'mdi:window-open-variant',
        'schliessen': 'mdi:window-closed-variant',
        'keine_daten': 'mdi:alert-outline'}.get('keine_daten' if keine_daten else ergebnis.status, 'mdi:help-circle-outline') }}
  attributes:
    raum: "{{ raum }}"
    t_innen: "{{ t_in }}"
    t_aussen: "{{ t_out }}"
    schimmel_stunden: "{{ schimmel_h }}"
    schimmel_ts: "{{ now_ts }}"
    hitzetag: "{{ hitzetag }}"
    grund: "{{ ('Keine Innenwerte – ' ~ (sensorprobleme | join(', ') or 'Sensoren prüfen')) if keine_daten else ergebnis.grund }}"
    sensorprobleme: "{{ sensorprobleme }}"
    einschraenkungen: "{{ [] if keine_daten else einschraenkungen }}"
    fenster_quelle: "{{ 'kontakt' if kontakt else 'geschaetzt' }}"
    vermutet_offen: "{{ (not kontakt) and win_open }}"
    veraltet: "{{ veraltet }}"
    ah_innen: "{{ ah_in }}"
    ah_aussen: "{{ ah_out }}"
    wand_temp: "{{ t_wand }}"
    wand_rf: "{{ rf_wand }}"
    co2: "{{ co2 }}"
    co2_abfall_pro_min: "{{ co2_abfall }}"
    ah_abfall_pro_min: "{{ ah_abfall }}"
    t_abfall_pro_min: "{{ t_abfall }}"
    co2_rate_gueltig: "{{ co2_rate_gueltig }}"
    ah_rate_gueltig: "{{ ah_rate_gueltig }}"
    rf_anstieg_10min: "{{ rf_anstieg }}"
    offen_seit: "{{ offen_seit }}"
    offen_min: "{{ offen_min }}"
    max_min: "{{ max_min }}"
    temp_bei_oeffnung: "{{ temp_bei_oeffnung }}"
    t_min_offen: "{{ t_min_offen }}"
    geschlossen_seit: "{{ geschlossen_seit }}"
    zuletzt_gelueftet: "{{ zuletzt_gelueftet }}"
    aktiv: "{{ aktiv_jetzt }}"
    aktiv_zuletzt: "{{ aktiv_zuletzt }}"
    nacht: "{{ nacht }}"
    dauer: "{{ dauer }}"
    dauerlueften: "{{ modus }}"
    sperre_aktiv: "{{ sperre_aktiv }}"
    sperre_beginn: "{{ sperre_beginn }}"
    sperre_ende: "{{ sperre_ende }}"
    regengeschuetzt: "{{ regengeschuetzt }}"
    schliessen_seit: "{{ schliessen_seit }}"
    verlauf: "{{ verlauf }}"
