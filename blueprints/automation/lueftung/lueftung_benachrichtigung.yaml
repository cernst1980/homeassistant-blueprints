blueprint:
  name: Lüftungsempfehlung – Benachrichtigungen
  description: >-
    Zentrale Benachrichtigung für alle Lüftungsstatus-Sensoren.
    „Jetzt lüften“ gebündelt und nur an Geräte, die zu Hause sind.
    „Fenster schließen“ gesammelt mit Erinnerung. Warnung bei offenen Fenstern
    beim Verlassen des Hauses sowie bei Regen/Unwetter. Fällige Grundlüftung wird nur
    erwähnt, wenn ohnehin gelüftet wird. Erledigtes wird still mit ✅ bestätigt.
  domain: automation
  source_url: https://github.com/cernst1980/homeassistant-blueprints/blob/main/blueprints/automation/lueftung/lueftung_benachrichtigung.yaml
  input:
    sensoren:
      name: Lüftungsstatus-Sensoren
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor
              integration: template
    geraete:
      name: Handys (Companion App)
      description: >-
        Anwesenheit wird über den device_tracker des jeweiligen Geräts bestimmt.
        Geräte ohne Tracker gelten immer als anwesend.
      selector:
        device:
          multiple: true
          filter:
            - integration: mobile_app
    nur_anwesende:
      name: „Lüften“-Hinweise nur an Geräte, die zu Hause sind
      description: >-
        „Fenster schließen“ und der Gute-Nacht-Check gehen immer nur an Anwesende (die wach sind).
        Ist niemand zu Hause, kommt stattdessen einmal die Abwesenheitswarnung; nach dem Heimkommen
        wird Offenes nachgeholt. Unwetterwarnungen gehen an alle Anwesenden, ist niemand da, an alle.
      default: true
      selector:
        boolean:
    verzoegerung:
      name: Verzögerung „lüften“ (Min.)
      description: So lange muss der Status stabil sein. „dringend“ kommt sofort.
      default: 10
      selector:
        number: { min: 0, max: 60, step: 1, unit_of_measurement: min, mode: box }
    erinnerung_lueften:
      name: Erinnerung „lüften“ alle (Min.)
      description: Solange eine Empfehlung unbeachtet bleibt. „Dringend“ erinnert doppelt so oft. 0 = keine Erinnerung.
      default: 30
      selector:
        number: { min: 0, max: 180, step: 5, unit_of_measurement: min, mode: box }
    grundlueftung_meldung:
      name: Grundlüftung melden
      description: >-
        Reine Grundlüftung (kein Messwert spricht fürs Lüften) ist selten eilig.
        „Mitnehmen“ (Standard) erwähnt sie nur, wenn ohnehin ein anderer Raum wegen Feuchte, CO₂ o. Ä.
        gelüftet werden muss („Bei der Gelegenheit auch: …“) – alle auf einmal. Im Monitor bleibt sie sichtbar.
      default: mitnehmen
      selector:
        select:
          options:
            - label: Sofort eigene Meldung
              value: sofort
            - label: Mitnehmen + einmal täglich Sammelmeldung
              value: mitnehmen_taeglich
            - label: Nur mitnehmen
              value: mitnehmen
            - label: Nie melden (nur Monitor)
              value: keine
    grundlueftung_zeit:
      name: Grundlüftung-Sammelmeldung um
      default: "12:00:00"
      selector:
        time:
    bestaetigung:
      name: Bestätigen, wenn erledigt
      description: >-
        Wird nach „Jetzt lüften“ gelüftet bzw. nach „Fenster schließen“ geschlossen, ersetzt eine stille
        Nachricht („✅ …“) die Aufforderung auf allen Handys – so sieht jeder, dass sich jemand gekümmert hat.
      default: true
      selector:
        boolean:
    bestaetigung_min:
      name: Lüften bestätigen nach (Min.)
      description: >-
        So lange nach dem letzten geöffneten Fenster warten, damit mehrere Räume in einer Nachricht
        zusammengefasst werden. Vergessene Räume werden dann genannt.
      default: 5
      selector:
        number: { min: 1, max: 20, step: 1, unit_of_measurement: min, mode: box }
    erinnerung:
      name: Erinnerung „schließen“ alle (Min.)
      description: Gilt für die gesammelte Nachricht aller offenen Räume. 0 = keine Erinnerung
      default: 10
      selector:
        number: { min: 0, max: 60, step: 1, unit_of_measurement: min, mode: box }
    schlaf_entitaeten:
      name: Schlafmodus (optional)
      description: >-
        Entitäten, die „an“ sind, solange jemand schläft – z. B. der Fokus-Sensor der iPhones
        (binary_sensor.<iphone>_focus) oder je Person ein Helfer, den ein Kurzbefehl beim Schlafen-Fokus
        schaltet. Gehört die Entität zu einem Handy, gilt sie nur für dieses Handy, sonst für alle.
        Wer schläft, bekommt keine Aufforderungen; schlafen alle Anwesenden, ist Ruhezeit.
        Leer = feste Ruhezeit (unten).
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: [binary_sensor, input_boolean, switch]
    schlaf_fenster_von:
      name: Schlafmodus zählt ab
      description: >-
        Ein Fokus tagsüber (z. B. Arbeiten) gilt nicht als Schlaf. Großzügig wählen (Standard 20–11 Uhr):
        Wann ihr schlaft, erkennt der Fokus selbst – das Fenster muss frühes Zubettgehen und langes
        Ausschlafen einschließen.
      default: "20:00:00"
      selector:
        time:
    schlaf_fenster_bis:
      name: Schlafmodus zählt bis
      default: "11:00:00"
      selector:
        time:
    ruhe_beginn:
      name: Ruhezeit Beginn (ohne Schlafmodus)
      description: Gute-Nacht-Check zu dieser Uhrzeit.
      default: "22:00:00"
      selector:
        time:
    ruhe_ende:
      name: Ruhezeit Ende (ohne Schlafmodus)
      description: Offene Lüft-Empfehlungen (auch Vorkühlen an Hitzetagen) werden dann nachgeholt.
      default: "07:00:00"
      selector:
        time:
    gute_nacht:
      name: Gute-Nacht-Check
      description: >-
        Beim Schlafengehen (Schlafmodus an bzw. Ruhezeit-Beginn) offene Fenster melden –
        außer Räumen mit erlaubter Nachtlüftung (z. B. Schlafzimmer).
      default: true
      selector:
        boolean:
    schliessen_nachts:
      name: „Schließen“-Hinweise auch in der Ruhezeit
      description: >-
        Aus = in der Ruhezeit (z. B. gekipptes Schlafzimmerfenster) erst nach Ende der Ruhezeit erinnern.
      default: false
      selector:
        boolean:
    abwesend_verzoegerung:
      name: Abwesenheits-Warnung nach (Min.)
      description: So lange muss zone.home auf 0 stehen (gegen kurzes GPS-Flattern).
      default: 3
      selector:
        number: { min: 0, max: 30, step: 1, unit_of_measurement: min, mode: box }
    abwesend_alle:
      name: Beim Verlassen vor allen offenen Fenstern warnen
      description: >-
        An = jedes offene Fenster melden (auch wegen Einbruchschutz).
        Aus = nur Fenster, die laut Empfehlung geschlossen werden sollten.
      default: true
      selector:
        boolean:
    wetter:
      name: Wetter-Entität (optional)
      description: Für Regen-/Unwetter-Hinweise, z. B. weather.forecast_home oder DWD.
      default: []
      selector:
        entity:
          filter:
            - domain: weather
    wind_max:
      name: Unwetter ab Windgeschwindigkeit (km/h)
      default: 50
      selector:
        number: { min: 20, max: 120, step: 5, unit_of_measurement: km/h, mode: box }
    sensorbericht_zeit:
      name: Täglicher Sensorbericht um
      description: >-
        Meldet einmal täglich ausgefallene Einzelsensoren, eingeschränkte Bewertungen und schwache
        Batterien. Zonen ganz ohne Innenwerte werden sofort (nach 30 Min.) gemeldet.
      default: "18:00:00"
      selector:
        time:
    batterien:
      name: Weitere Batterien überwachen (optional)
      description: >-
        Batterien der Geräte, deren Sensoren in den Zonen verwendet werden, werden automatisch erkannt.
        Hier nur zusätzliche eintragen (z. B. Geräte ohne Zuordnung).
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor
              device_class: battery
    batterie_min:
      name: Batterie schwach unter (%)
      default: 15
      selector:
        number: { min: 5, max: 50, step: 5, unit_of_measurement: "%", mode: box }
    web_ui:
      name: Zusätzlich in der HA-Weboberfläche anzeigen
      description: Persistente Benachrichtigungen, die automatisch wieder verschwinden.
      default: true
      selector:
        boolean:

mode: parallel
max: 25

triggers:
  # ---- neuer Bedarf / neue Schließ-Gründe ----
  - trigger: state
    entity_id: !input sensoren
    to: lueften
    for:
      minutes: !input verzoegerung
    id: bedarf
  - trigger: state
    entity_id: !input sensoren
    to: dringend
    id: bedarf
  - trigger: state
    entity_id: !input sensoren
    to: schliessen
    id: schliessen
  # ---- Erinnerungen (zustandslos, pro Raum berechnet) ----
  - trigger: time_pattern
    minutes: "/5"
    id: erinnerung
  # ---- Nachholen: Ruhezeit-Ende, Aufwachen, Heimkommen (pro Person), Neustart ----
  - trigger: time
    at: !input ruhe_ende
    id: nachholen
  - trigger: state
    entity_id: !input schlaf_entitaeten
    from: "on"
    to: "off"
    id: nachholen
  # Heimkommen: Personenzahl zu Hause stieg und blieb 5 Min. stabil (kommen zwei kurz nacheinander: ein Lauf)
  - trigger: state
    entity_id: zone.home
    for:
      minutes: 5
    id: ankunft
  - trigger: homeassistant
    event: start
    id: start
  - trigger: event
    event_type: automation_reloaded
    id: start
  # ---- Schlafengehen ----
  - trigger: state
    entity_id: !input schlaf_entitaeten
    from: "off"
    to: "on"
    id: gute_nacht
  - trigger: time
    at: !input ruhe_beginn
    id: gute_nacht
  # ---- Erledigt / Statuswechsel ----
  - trigger: state
    entity_id: !input sensoren
    from: [lueften, dringend, schliessen, offen]
    to: [ok, offen]
    id: erledigt
  - trigger: state
    entity_id: !input sensoren
    from: schliessen
    to: [lueften, dringend]
    id: erledigt
  - trigger: state
    entity_id: !input sensoren
    from: [lueften, dringend]
    to: schliessen
    id: erledigt
  - trigger: state
    entity_id: !input sensoren
    from: [lueften, dringend, schliessen]
    to: [keine_daten, unavailable, unknown]
    id: erledigt
  # Empfehlung befolgt (Statussensor setzt erledigt_ts) → gesammelte ✅-Bestätigung
  - trigger: state
    entity_id: !input sensoren
    attribute: erledigt_ts
    id: befolgt
  # ---- Anwesenheit, Wetter, Sensoren ----
  - trigger: numeric_state
    entity_id: zone.home
    below: 1
    for:
      minutes: !input abwesend_verzoegerung
    id: abwesend
  - trigger: numeric_state
    entity_id: zone.home
    above: 0
    id: heimkehr
  - trigger: state
    entity_id: !input wetter
    id: wetter
  - trigger: state
    entity_id: !input sensoren
    to: keine_daten
    for:
      minutes: 30
    id: ausfall
  - trigger: state
    entity_id: !input sensoren
    from: keine_daten
    id: wieder_da
  - trigger: time
    at: !input sensorbericht_zeit
    id: sensorbericht
  - trigger: time
    at: !input grundlueftung_zeit
    id: grundlueftung
  # nur für „Grundlüftung sofort melden“
  - trigger: state
    entity_id: !input sensoren
    attribute: grundlueftung_faellig
    to: true
    for:
      minutes: !input verzoegerung
    id: grundlueftung_neu

variables:
  sensoren: !input sensoren
  geraete: !input geraete
  nur_anwesende: !input nur_anwesende
  erinnerung: !input erinnerung
  erinnerung_lueften: !input erinnerung_lueften
  ruhe_beginn: !input ruhe_beginn
  ruhe_ende: !input ruhe_ende
  abwesend_alle: !input abwesend_alle
  schliessen_nachts: !input schliessen_nachts
  web_ui: !input web_ui
  grundlueftung_meldung: !input grundlueftung_meldung
  bestaetigung: !input bestaetigung
  bestaetigung_min: !input bestaetigung_min
  verzoegerung: !input verzoegerung
  grundlueftung_zeit: !input grundlueftung_zeit
  batterien: !input batterien
  batterie_min: !input batterie_min
  wind_max: !input wind_max
  wetter_in: !input wetter
  wetter: "{{ wetter_in if wetter_in is string else ((wetter_in | first) if wetter_in | length > 0 else '') }}"
  schlaf_entitaeten: !input schlaf_entitaeten
  schlaf_fenster_von: !input schlaf_fenster_von
  schlaf_fenster_bis: !input schlaf_fenster_bis
  gute_nacht: !input gute_nacht
  # Ende eines Fokus tagsüber (z. B. Arbeiten) ist kein Aufwachen
  nachholen_ok: >-
    {%- set se = schlaf_entitaeten if (schlaf_entitaeten is iterable and schlaf_entitaeten is not string) else [] -%}
    {%- if trigger is defined and trigger.id == 'nachholen' and trigger.platform == 'time' and se | length > 0 -%}{{- false -}}
    {%- elif trigger is defined and trigger.id == 'nachholen' and trigger.platform == 'state' -%}
      {%- set n = now().strftime('%H:%M:%S') -%}
      {%- set v = schlaf_fenster_von -%}{%- set b = schlaf_fenster_bis -%}
      {{- (n >= v or n < b) if v > b else (n >= v and n < b) -}}
    {%- else -%}{{- true -}}{%- endif -%}

  # ---- Ziele (notify-Dienste) ----
  # Nur Handys, die es (noch) gibt – ein gelöschtes Gerät hätte keinen Namen und keinen Dienst
  ziele_alle: >-
    {%- set ns = namespace(l=[]) -%}
    {%- for d in geraete if device_attr(d, 'name') -%}
      {%- set ns.l = ns.l + ['notify.mobile_app_' ~ (device_attr(d, 'name') | slugify)] -%}
    {%- endfor -%}
    {{- ns.l -}}
  ziele_da: &ziele_da >-
    {%- set ns = namespace(l=[]) -%}
    {%- for d in geraete if device_attr(d, 'name') -%}
      {%- set tr = device_entities(d) | select('match', 'device_tracker[.]') | list -%}
      {%- if tr | length == 0 or is_state(tr[0], 'home') -%}
        {%- set ns.l = ns.l + ['notify.mobile_app_' ~ (device_attr(d, 'name') | slugify)] -%}
      {%- endif -%}
    {%- endfor -%}
    {{- ns.l -}}
  # Wer schläft? Schlafmodus-Entität des Handys (oder ohne Handy-Bezug: alle) im Schlaf-Zeitfenster,
  # ohne Schlafmodus die feste Ruhezeit.
  schlafend: &schlafend >-
    {%- set n = now().strftime('%H:%M:%S') -%}
    {%- set ns = namespace(l=[]) -%}
    {%- set se = schlaf_entitaeten if (schlaf_entitaeten is iterable and schlaf_entitaeten is not string) else [] -%}
    {%- if se | length > 0 -%}
      {%- set v = schlaf_fenster_von -%}{%- set b = schlaf_fenster_bis -%}
      {%- set im_fenster = (n >= v or n < b) if v > b else (n >= v and n < b) -%}
      {#- Entitäten ohne Handy-Bezug (z. B. Helfer) gelten für alle -#}
      {%- set hn = namespace(e=[]) -%}
      {%- for d in geraete -%}{%- set hn.e = hn.e + device_entities(d) -%}{%- endfor -%}
      {%- set global_an = se | reject('in', hn.e) | select('is_state', 'on') | list | count > 0 -%}
      {%- for d in geraete if device_attr(d, 'name') -%}
        {%- set schlaeft = im_fenster and (global_an
              or (se | select('in', device_entities(d)) | select('is_state', 'on') | list | count > 0)) -%}
        {%- if schlaeft -%}{%- set ns.l = ns.l + ['notify.mobile_app_' ~ (device_attr(d, 'name') | slugify)] -%}{%- endif -%}
      {%- endfor -%}
    {%- else -%}
      {%- set ruhe = (n >= ruhe_beginn or n < ruhe_ende) if ruhe_beginn > ruhe_ende
            else ((n >= ruhe_beginn and n < ruhe_ende) if ruhe_beginn < ruhe_ende else false) -%}
      {%- if ruhe -%}{%- set ns.l = ziele_alle -%}{%- endif -%}
    {%- endif -%}
    {{- ns.l -}}
  ziele_wach: &ziele_wach "{{ ziele_da | reject('in', schlafend) | list }}"
  ziele_bedarf: &ziele_bedarf "{{ ziele_wach if nur_anwesende else (ziele_alle | reject('in', schlafend) | list) }}"
  ziele_dringlich: "{{ ziele_da if ziele_da | length > 0 else ziele_alle }}"
  jemand_da: "{{ (states('zone.home') | int(0)) > 0 }}"

  # ---- Wetter ----
  wetter_zustand: &wetter_zustand "{{ states(wetter) if wetter else '' }}"
  unwetter: &unwetter >-
    {{- wetter != '' and (wetter_zustand in ['lightning', 'lightning-rainy', 'hail', 'exceptional']
        or (state_attr(wetter, 'wind_speed') | float(0)) >= wind_max) -}}
  regen: &regen "{{ wetter_zustand in ['rainy', 'pouring', 'snowy-rainy', 'lightning-rainy', 'snowy'] }}"
  wetter_hinweis: >-
    {%- if unwetter -%}⛈ Unwetter – nur wenn nötig und nur kurz lüften.
    {%- elif regen -%}🌧 Regen – kurz stoßlüften, Fensterbank im Blick behalten.
    {%- endif -%}

  # ---- Raumlisten ----
  bedarf: &bedarf >-
    {%- set ns = namespace(l=[], mit=[], dringend=false) -%}
    {#- „lüften“ zählt erst nach der Verzögerung (stabil), „dringend“ sofort -#}
    {#- nach einem Neustart sind alle last_changed frisch – dann alle „lüften“-Räume nehmen -#}
    {%- set neustart = trigger is defined and trigger.id == 'start' -%}
    {%- set stabil = expand(sensoren) | selectattr('state', 'eq', 'lueften')
          | selectattr('last_changed', 'le', now() - timedelta(minutes=0 if neustart else (verzoegerung | int(0))))
          | map(attribute='entity_id') | list -%}
    {%- for s in sensoren if is_state(s, 'dringend') or s in stabil
          or (is_state(s, 'ok') and state_attr(s, 'grundlueftung_faellig') is true) -%}
      {%- set g = state_attr(s, 'grund') or '' -%}
      {%- set name = state_attr(s, 'raum') or state_attr(s, 'friendly_name') -%}
      {%- set nur_grundlueftung = is_state(s, 'ok') or (g.startswith('Grundlüftung') and ' · ' not in g) -%}
      {%- if nur_grundlueftung -%}
        {#- Reine Grundlüftung: nicht bei Regen/Unwetter; je nach Einstellung sofort oder mitnehmen -#}
        {%- if not ((regen or unwetter) and not state_attr(s, 'regengeschuetzt')) -%}
          {%- if grundlueftung_meldung == 'sofort' -%}{%- set ns.l = ns.l + [name ~ ': ' ~ g] -%}
          {%- elif grundlueftung_meldung != 'keine' -%}{%- set ns.mit = ns.mit + [name] -%}{%- endif -%}
        {%- endif -%}
      {%- else -%}
        {%- set ns.l = ns.l + [name ~ ': ' ~ g] -%}
        {%- if is_state(s, 'dringend') -%}{%- set ns.dringend = true -%}{%- endif -%}
      {%- endif -%}
    {%- endfor -%}
    {{- {'liste': ns.l, 'mit': ns.mit, 'dringend': ns.dringend} -}}
  bedarf_text: &bedarf_text >-
    {{ bedarf.liste | join('\n') }}
    {%- if bedarf.mit | length > 0 %}{{ '\n' }}Bei der Gelegenheit auch: {{ bedarf.mit | join(', ') }} (Grundlüftung){% endif %}
    {%- if bedarf.liste | length + bedarf.mit | length > 1 %}{{ '\n' }}Tipp: Querlüften – Fenster gleichzeitig öffnen.{% endif %}
    {%- if wetter_hinweis %}{{ '\n' ~ wetter_hinweis }}{% endif %}
  # Erinnerungen pro Raum mit wachsendem, gedeckeltem Abstand (zustandslos, alle 5 Min. geprüft):
  # Standard (30 Min.): 30, 60, 120, 240, dann alle 4 h; dringend 15, 30, 60, 120, dann alle 2 h
  lueften_faellig: >-
    {%- set iv = erinnerung_lueften | int(0) -%}
    {%- set ns = namespace(f=false) -%}
    {%- if iv > 0 -%}
      {%- for st in expand(sensoren) if st.state in ['lueften', 'dringend'] -%}
        {%- set d = st.state == 'dringend' -%}
        {%- set i = [(iv / 2) if d else iv, 5] | max -%}
        {%- set cap = [i, 120 if d else 240] | max -%}
        {%- set m = (as_timestamp(now()) - as_timestamp(st.last_changed, 0)) / 60 - (0 if d else (verzoegerung | int(0))) -%}
        {%- set p = namespace(t=i, g=i) -%}
        {%- for _ in range(300) if p.t + p.g <= m -%}{%- set p.t = p.t + p.g -%}{%- set p.g = [p.g * 2, cap] | min -%}{%- endfor -%}
        {%- if m >= i and (m - p.t) < 5 -%}{%- set ns.f = true -%}{%- endif -%}
      {%- endfor -%}
    {%- endif -%}
    {{- ns.f -}}
  # Standard (10 Min.): 10, 20, 40, 80, dann stündlich
  schliessen_faellig: >-
    {%- set iv = erinnerung | int(0) -%}
    {%- set ns = namespace(f=false) -%}
    {%- if iv > 0 -%}
      {%- for st in expand(sensoren) if st.state == 'schliessen' -%}
        {%- set i = [iv, 5] | max -%}
        {%- set cap = [i, 60] | max -%}
        {%- set m = (as_timestamp(now()) - as_timestamp(st.last_changed, 0) - 90) / 60 -%}
        {%- set p = namespace(t=i, g=i) -%}
        {%- for _ in range(300) if p.t + p.g <= m -%}{%- set p.t = p.t + p.g -%}{%- set p.g = [p.g * 2, cap] | min -%}{%- endfor -%}
        {%- if m >= i and (m - p.t) < 5 -%}{%- set ns.f = true -%}{%- endif -%}
      {%- endfor -%}
    {%- endif -%}
    {{- ns.f -}}
  offen_wetter: >-
    {%- set ns = namespace(l=[]) -%}
    {%- for s in sensoren if states(s) in ['offen', 'schliessen'] and (unwetter or not state_attr(s, 'regengeschuetzt')) -%}
      {%- set name = state_attr(s, 'raum') or state_attr(s, 'friendly_name') -%}
      {%- set ns.l = ns.l + [name ~ (' (vermutlich offen, kein Kontakt)' if state_attr(s, 'vermutet_offen') else '')] -%}
    {%- endfor -%}
    {{- ns.l -}}
  offen_alle: >-
    {%- set ns = namespace(l=[]) -%}
    {%- for s in sensoren if states(s) in ['offen', 'schliessen'] -%}
      {%- set name = state_attr(s, 'raum') or state_attr(s, 'friendly_name') -%}
      {%- set ns.l = ns.l + [name ~ (' (vermutlich offen, kein Kontakt)' if state_attr(s, 'vermutet_offen') else '')] -%}
    {%- endfor -%}
    {{- ns.l -}}
  offene_fenster: >-
    {%- set ns = namespace(l=[]) -%}
    {%- for s in sensoren -%}
      {%- set st = states(s) -%}
      {%- if st == 'schliessen' or (abwesend_alle and st == 'offen') -%}
        {%- set name = state_attr(s, 'raum') or state_attr(s, 'friendly_name') -%}
        {%- set zusatz = [] -%}
        {%- if st == 'schliessen' -%}{%- set zusatz = zusatz + ['sollte geschlossen werden'] -%}{%- endif -%}
        {%- if state_attr(s, 'vermutet_offen') -%}{%- set zusatz = zusatz + ['vermutlich offen, kein Kontakt'] -%}{%- endif -%}
        {%- set ns.l = ns.l + [name ~ ((' (' ~ zusatz | join(', ') ~ ')') if zusatz | length > 0 else '')] -%}
      {%- endif -%}
    {%- endfor -%}
    {{- ns.l -}}
  # Ruhezeit = alle Anwesenden schlafen (bzw. feste Ruhezeit, wenn niemand zu Hause ist)
  ruhezeit: &ruhezeit "{{ (ziele_da | length > 0 and ziele_wach | length == 0) or (ziele_da | length == 0 and schlafend | length > 0) }}"
  # Offene Fenster für den Gute-Nacht-Check (ohne erlaubte Nachtlüftung)
  offen_nachts: &offen_nachts >-
    {%- set ns = namespace(l=[]) -%}
    {%- for st in expand(sensoren) if st.state in ['offen', 'schliessen'] and not (st.attributes.nacht | default(false)) -%}
      {%- set ns.l = ns.l + [(st.attributes.raum | default(st.name))
            ~ (' (vermutlich offen, kein Kontakt)' if st.attributes.vermutet_offen | default(false) else '')] -%}
    {%- endfor -%}
    {{- ns.l -}}

  # Wer ist gerade heimgekommen? (Personenzahl gestiegen; Handys seit höchstens 15 Min. zu Hause)
  ankommende: >-
    {%- set ns = namespace(l=[]) -%}
    {%- set f = trigger.from_state if (trigger is defined and trigger.id == 'ankunft') else none -%}
    {%- set mehr = f is not none and is_number(f.state) and (trigger.to_state.state | int(0)) > (f.state | int(0)) -%}
    {%- for d in geraete if mehr and device_attr(d, 'name') -%}
      {%- for st in expand(device_entities(d) | select('match', 'device_tracker[.]') | list) -%}
        {%- set m = (as_timestamp(now()) - as_timestamp(st.last_changed, 0)) / 60 -%}
        {%- if st.state == 'home' and m < 15 -%}
          {%- set ns.l = ns.l + ['notify.mobile_app_' ~ (device_attr(d, 'name') | slugify)] -%}{%- endif -%}
      {%- endfor -%}
    {%- endfor -%}
    {{- ns.l | unique | list -}}
  # Empfänger beim Nachholen: Heimkommen → nur die Ankommenden; Aufwachen (Schlafmodus eines Handys) → nur dieses
  nachhol_ziele: >-
    {%- set d = device_id(trigger.entity_id) if (trigger is defined and trigger.id == 'nachholen'
          and trigger.platform == 'state') else none -%}
    {%- if trigger is defined and trigger.id == 'ankunft' -%}{{- ankommende | reject('in', schlafend) | list -}}
    {%- elif d and d in geraete and device_attr(d, 'name') -%}
      {%- set z = 'notify.mobile_app_' ~ (device_attr(d, 'name') | slugify) -%}
      {{- [z] if z in ziele_da else [] -}}
    {%- else -%}{{- none -}}{%- endif -%}

actions:
  # ---------- HA-Weboberfläche: immer der aktuelle Stand, unabhängig von Handys ----------
  - if:
      - "{{ web_ui }}"
      - condition: trigger
        id: [bedarf, schliessen, erledigt, befolgt, start, nachholen, ankunft, ausfall, wieder_da, wetter, grundlueftung_neu]
    then:
      - variables:
          web_lueften: >-
            {{ bedarf.liste | join('\n') }}
            {%- if bedarf.liste | length > 0 and bedarf.mit | length > 0 %}{{ '\n' }}Bei der Gelegenheit auch: {{ bedarf.mit | join(', ') }} (Grundlüftung){% endif %}
          web_schliessen: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for st in expand(sensoren) if st.state == 'schliessen' -%}
              {%- set ns.l = ns.l + [(st.attributes.raum | default(st.name)) ~ ': ' ~ (st.attributes.grund | default(''))] -%}
            {%- endfor -%}
            {{- ns.l | join('\n') -}}
      - if: "{{ bedarf.liste | length > 0 }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: lueftung_bedarf
              title: "🪟 Jetzt lüften"
              message: "{{ web_lueften }}"
        else:
          - action: persistent_notification.dismiss
            data:
              notification_id: lueftung_bedarf
      - if: "{{ web_schliessen | length > 0 }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: lueftung_schliessen
              title: "🪟 Fenster schließen"
              message: "{{ web_schliessen }}"
        else:
          - action: persistent_notification.dismiss
            data:
              notification_id: lueftung_schliessen

  # ---------- Jetzt lüften (gebündelt, an Anwesende, die wach sind) ----------
  # Neuer Bedarf, Erinnerung (pro Raum), nach Regen, Aufwachen/Ruhezeit-Ende, Heimkommen, Neustart
  - if:
      - condition: trigger
        id: [bedarf, erinnerung, wetter, grundlueftung_neu, nachholen, ankunft, start]
      - >-
        {{ trigger.id in ['bedarf', 'nachholen', 'ankunft', 'start']
           or (trigger.id == 'grundlueftung_neu' and grundlueftung_meldung == 'sofort')
           or (trigger.id == 'erinnerung' and lueften_faellig)
           or (trigger.id == 'wetter' and not regen and not unwetter and trigger.from_state is not none
               and trigger.from_state.state in ['rainy', 'pouring', 'snowy-rainy', 'lightning-rainy', 'snowy',
                                                'lightning', 'hail', 'exceptional']) }}
      - "{{ bedarf.liste | length > 0 }}"
      - "{{ nachholen_ok and (not unwetter or bedarf.dringend) }}"
      # Erreichen mehrere Räume in derselben Minute die Schwelle, meldet nur ein Lauf
      - >-
        {%- if trigger.id != 'bedarf' -%}{{- true -}}
        {%- else -%}
          {#- der zuletzt dazugekommene Raum meldet (seine Nachricht enthält alle); Gleichstand: größte ID -#}
          {%- set ns = namespace(k=[]) -%}
          {%- for st in expand(sensoren) if st.state in ['lueften', 'dringend'] -%}
            {%- set t = as_timestamp(st.last_changed, 0) + (0 if st.state == 'dringend' else (verzoegerung | int(0)) * 60) -%}
            {%- if as_timestamp(now()) - 60 <= t <= as_timestamp(now()) -%}{%- set ns.k = ns.k + [[t, st.entity_id]] -%}{%- endif -%}
          {%- endfor -%}
          {{- trigger.entity_id not in (ns.k | map(attribute=1) | list) or (ns.k | max)[1] == trigger.entity_id -}}
        {%- endif -%}
    then:
      - variables:
          empfaenger: "{{ nachhol_ziele if nachhol_ziele is not none else ziele_bedarf }}"
          # Grundlüftung nur in der ersten Meldung einer Runde erwähnen, nicht in jeder Erinnerung
          text: >-
            {%- if trigger.id == 'erinnerung' -%}
              {{ bedarf.liste | join('\n') }}
              {%- if wetter_hinweis %}{{ '\n' ~ wetter_hinweis }}{% endif %}
            {%- else -%}{{ bedarf_text }}{%- endif -%}
      - repeat:
          for_each: "{{ empfaenger }}"
          sequence:
            - action: "{{ repeat.item }}"
              continue_on_error: true
              data:
                title: "{{ '🪟 Erinnerung: lüften' if trigger.id == 'erinnerung' else '🪟 Jetzt lüften' }}"
                message: "{{ text }}"
                data:
                  tag: lueftung_bedarf
                  push:
                    interruption-level: "{{ 'time-sensitive' if bedarf.dringend else 'active' }}"

  # ---------- Fenster schließen (gesammelt, an Anwesende, die wach sind) ----------
  # Beim Wechsel auf „schliessen“ (90 s sammeln, nur der neueste Lauf), Erinnerung (pro Raum),
  # Aufwachen/Ruhezeit-Ende, Heimkommen, Neustart. Ist niemand da, genügt die Abwesenheitswarnung.
  - if:
      - condition: trigger
        id: [schliessen, erinnerung, nachholen, ankunft, start]
    then:
      - if: "{{ trigger.id == 'schliessen' }}"
        then:
          - variables:
              mein_ts: "{{ as_timestamp(trigger.to_state.last_changed, 0) }}"
          - delay:
              seconds: 90
      - variables:
          zu_schliessen: >-
            {%- set ns = namespace(l=[], regen=false, neuester=0) -%}
            {%- for st in expand(sensoren) if st.state == 'schliessen' -%}
              {%- set ns.l = ns.l + [(st.attributes.raum | default(st.name)) ~ ': ' ~ (st.attributes.grund | default(''))
                    ~ (' (vermutlich offen – kein Kontakt)' if st.attributes.vermutet_offen | default(false) else '')] -%}
              {%- if not (st.attributes.regengeschuetzt | default(false)) -%}{%- set ns.regen = true -%}{%- endif -%}
              {%- set ns.neuester = [ns.neuester, as_timestamp(st.last_changed, 0)] | max -%}
            {%- endfor -%}
            {{- {'zeilen': ns.l, 'regen_relevant': ns.regen, 'neuester': ns.neuester} -}}
          ziele_da: *ziele_da
          schlafend: *schlafend
          ziele_wach: *ziele_wach
          empfaenger: >-
            {%- if nachhol_ziele is not none -%}{{- nachhol_ziele -}}
            {%- else -%}{{- ziele_da if schliessen_nachts else ziele_wach -}}{%- endif -%}
          senden: >-
            {%- set z = zu_schliessen -%}
            {%- if z.zeilen | length == 0 or empfaenger | length == 0 or not nachholen_ok -%}{{- false -}}
            {%- elif trigger.id == 'schliessen' -%}{{- mein_ts >= z.neuester - 1 -}}
            {%- elif trigger.id == 'erinnerung' -%}{{- schliessen_faellig -}}
            {%- else -%}{{- true -}}{%- endif -%}
      - if: "{{ senden }}"
        then:
          - variables:
              titel: >-
                {{- ('🪟 ' ~ (zu_schliessen.zeilen[0].split(':')[0]) ~ ': Fenster schließen') if zu_schliessen.zeilen | length == 1
                    else ('🪟 Fenster schließen (' ~ zu_schliessen.zeilen | length ~ ')') -}}
              text: >-
                {{ zu_schliessen.zeilen | join('\n') }}
                {%- if unwetter or (regen and zu_schliessen.regen_relevant) %}{{ '\n' }}{{ '⛈ Unwetter' if unwetter else '🌧 Es regnet' }}{% endif %}
          - repeat:
              for_each: "{{ empfaenger }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: "{{ titel }}"
                    message: "{{ text }}"
                    data:
                      tag: lueftung_schliessen
                      push:
                        interruption-level: time-sensitive

  - choose:
      # ---------- Grundlüftung: einmal täglich Sammelmeldung (nur Modus „mitnehmen + täglich“) ----------
      - conditions:
          - condition: trigger
            id: grundlueftung
          - "{{ grundlueftung_meldung == 'mitnehmen_taeglich' }}"
          - "{{ bedarf.mit | length > 0 and bedarf.liste | length == 0 }}"
          - "{{ not ruhezeit and ziele_bedarf | length > 0 }}"
        sequence:
          - repeat:
              for_each: "{{ ziele_bedarf }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: "🪟 Grundlüftung fällig"
                    message: >-
                      {{ bedarf.mit | join(', ') }} – je 5 Min. stoßlüften
                      {%- if bedarf.mit | length > 1 %} (am besten gleichzeitig){% endif %}.
                    data:
                      tag: lueftung_bedarf
                      push:
                        interruption-level: passive

      # ---------- Gute-Nacht-Check: offene Fenster beim Schlafengehen ----------
      - conditions:
          - condition: trigger
            id: gute_nacht
          - "{{ gute_nacht }}"
          # feste Uhrzeit nur ohne Schlafmodus; Schlafmodus nur im Schlaf-Zeitfenster
          - >-
            {%- set se = schlaf_entitaeten if (schlaf_entitaeten is iterable and schlaf_entitaeten is not string) else [] -%}
            {%- if trigger.platform == 'time' -%}{{- se | length == 0 -}}
            {%- else -%}
              {%- set n = now().strftime('%H:%M:%S') -%}
              {%- set v = schlaf_fenster_von -%}{%- set b = schlaf_fenster_bis -%}
              {{- (n >= v or n < b) if v > b else (n >= v and n < b) -}}
            {%- endif -%}
          - "{{ offen_nachts | length > 0 and ziele_da | length > 0 }}"
        sequence:
          - variables:
              # Schlafmodus eines Handys → nur an dieses Handy; sonst (Helfer ohne Handy, feste Zeit) an alle Anwesenden
              empfaenger: >-
                {%- set d = device_id(trigger.entity_id) if trigger.platform == 'state' else none -%}
                {%- if d and d in geraete and device_attr(d, 'name') -%}
                  {%- set z = 'notify.mobile_app_' ~ (device_attr(d, 'name') | slugify) -%}
                  {{- [z] if z in ziele_da else [] -}}
                {%- else -%}{{- ziele_da -}}{%- endif -%}
          - repeat:
              for_each: "{{ empfaenger }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: "🌙 Gute Nacht – noch offen"
                    message: "{{ offen_nachts | join('\n') }}"
                    data:
                      tag: lueftung_nacht
                      push:
                        interruption-level: time-sensitive
          - if: "{{ web_ui }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: lueftung_nacht
                  title: "🌙 Gute Nacht – noch offen"
                  message: "{{ offen_nachts | join('\n') }}"

      # ---------- Abwesenheit: offene Fenster beim Verlassen ----------
      - conditions:
          - condition: trigger
            id: abwesend
          - "{{ offene_fenster | length > 0 }}"
        sequence:
          - repeat:
              for_each: "{{ ziele_alle }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: "⚠️ Niemand zu Hause – Fenster offen"
                    message: "{{ offene_fenster | join('\n') }}"
                    data:
                      tag: lueftung_abwesend
                      push:
                        interruption-level: time-sensitive
          - if: "{{ web_ui }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: lueftung_abwesend
                  title: "⚠️ Niemand zu Hause – Fenster offen"
                  message: "{{ offene_fenster | join('\n') }}"

      # ---------- Wetter: Regen/Unwetter bei offenen Fenstern ----------
      - conditions:
          - condition: trigger
            id: wetter
          - "{{ wetter != '' and (regen or unwetter) }}"
          # nur, wenn es schlechter wird (auch reiner Sturm ohne Zustandswechsel), nicht bei rainy ↔ pouring
          - >-
            {%- set f = trigger.from_state -%}
            {%- if f is none -%}{{- false -}}
            {%- else -%}
              {%- set war_uw = f.state in ['lightning', 'lightning-rainy', 'hail', 'exceptional']
                    or (f.attributes.wind_speed | default(0) | float(0)) >= wind_max -%}
              {%- set war_regen = f.state in ['rainy', 'pouring', 'snowy-rainy', 'lightning-rainy', 'snowy'] -%}
              {{- (unwetter and not war_uw) or (regen and not war_regen and not war_uw) -}}
            {%- endif -%}
          - "{{ offen_wetter | length > 0 }}"
        sequence:
          - variables:
              titel: "{{ '⛈ Unwetter – Fenster schließen' if unwetter else '🌧 Regen – Fenster offen' }}"
              text: "{{ offen_wetter | join('\n') }}"
              # Unwetter weckt auf, Regen nur an Wache (ist niemand da: an alle)
              empfaenger: >-
                {{- ziele_dringlich if (unwetter or ziele_da | length == 0) else ziele_wach -}}
          - repeat:
              for_each: "{{ empfaenger }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: "{{ titel }}"
                    message: "{{ text }}"
                    data:
                      tag: lueftung_wetter
                      push:
                        interruption-level: time-sensitive
          - if: "{{ web_ui }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: lueftung_wetter
                  title: "{{ titel }}"
                  message: "{{ text }}"

      # ---------- Zone ohne Innenwerte: sofort melden ----------
      - conditions:
          - condition: trigger
            id: ausfall
        sequence:
          - variables:
              titel: "⚠️ Lüftung {{ state_attr(trigger.entity_id, 'raum') or trigger.entity_id }}: keine Empfehlung möglich"
              text: "{{ state_attr(trigger.entity_id, 'grund') or 'Sensoren prüfen' }}"
              tag: "lueftung_ausfall_{{ trigger.entity_id | replace('.', '_') }}"
          - repeat:
              for_each: "{{ ziele_alle }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: "{{ titel }}"
                    message: "{{ text }}"
                    data:
                      tag: "{{ tag }}"
          - if: "{{ web_ui }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: "{{ tag }}"
                  title: "{{ titel }}"
                  message: "{{ text }}"

      # ---------- Zone wieder mit Daten: Ausfallmeldung entfernen ----------
      - conditions:
          - condition: trigger
            id: wieder_da
        sequence:
          - variables:
              tag: "lueftung_ausfall_{{ trigger.entity_id | replace('.', '_') }}"
          - action: persistent_notification.dismiss
            data:
              notification_id: "{{ tag }}"
          - repeat:
              for_each: "{{ ziele_alle }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    message: clear_notification
                    data:
                      tag: "{{ tag }}"

      # ---------- Täglicher Sensorbericht ----------
      - conditions:
          - condition: trigger
            id: sensorbericht
        sequence:
          - variables:
              bericht: >-
                {%- set ns = namespace(l=[]) -%}
                {%- for s in sensoren -%}
                  {%- set raum = state_attr(s, 'raum') or state_attr(s, 'friendly_name') or s -%}
                  {%- for p in (state_attr(s, 'sensorprobleme') or []) if p not in ns.l -%}
                    {%- set ns.l = ns.l + [p] -%}
                  {%- endfor -%}
                  {%- set e = state_attr(s, 'einschraenkungen') or [] -%}
                  {%- if e | count > 0 -%}{%- set ns.l = ns.l + [raum ~ ' eingeschränkt: ' ~ (e | join(', '))] -%}{%- endif -%}
                  {%- if states(s) in ['keine_daten', 'unavailable', 'unknown'] -%}
                    {%- set ns.l = ns.l + [raum ~ ': keine Empfehlung möglich (' ~ states(s) ~ ')'] -%}{%- endif -%}
                {%- endfor -%}
                {#- Batterien: automatisch aus den Geräten der Zonen (Attribut „batterien“) plus manuelle Liste -#}
                {%- set ns2 = namespace(b=(batterien if batterien is iterable and batterien is not string else []) | list) -%}
                {%- for s in sensoren -%}
                  {%- set bl = state_attr(s, 'batterien') -%}
                  {%- if bl is iterable and bl is not string -%}{%- set ns2.b = ns2.b + (bl | list) -%}{%- endif -%}
                {%- endfor -%}
                {%- for b in ns2.b | unique -%}
                  {%- set name = state_attr(b, 'friendly_name') or b -%}
                  {%- if b.startswith('binary_sensor.') -%}
                    {%- if is_state(b, 'on') -%}{%- set ns.l = ns.l + ['🔋 ' ~ name ~ ': schwach'] -%}{%- endif -%}
                  {%- else -%}
                    {%- set v = states(b) | float(-1) -%}
                    {%- if 0 <= v < (batterie_min | float(15)) -%}
                      {%- set ns.l = ns.l + ['🔋 ' ~ name ~ ': ' ~ (v | round(0) | int) ~ ' %'] -%}
                    {%- elif is_state(b, 'unavailable') -%}
                      {%- set ns.l = ns.l + ['🔋 ' ~ name ~ ': nicht verfügbar'] -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {#- Handys, die es nicht mehr gibt (App neu installiert, Gerät gelöscht) -#}
                {%- for d in geraete if not device_attr(d, 'name') -%}
                  {%- set ns.l = ns.l + ['📱 Ein in der Automation gewähltes Handy existiert nicht mehr – bitte in der Automation neu auswählen'] -%}
                {%- endfor -%}
                {%- for d in geraete if device_attr(d, 'name') and (device_entities(d) | select('match', 'device_tracker[.]') | list | count == 0) -%}
                  {%- set ns.l = ns.l + ['📱 ' ~ device_attr(d, 'name') ~ ': kein Standort-Tracker – gilt immer als zu Hause'] -%}
                {%- endfor -%}
                {#- Statussensor rechnet nicht mehr (Template-Fehler): er aktualisiert sich sonst jede Minute -#}
                {%- for st in expand(sensoren) if st.state not in ['unavailable', 'unknown']
                      and as_timestamp(now()) - as_timestamp(st.last_updated, 0) > 600 -%}
                  {%- set ns.l = ns.l + ['⚠️ ' ~ (st.attributes.raum | default(st.name)) ~ ': Status seit über 10 Min. nicht aktualisiert (Template-Fehler? Protokoll prüfen)'] -%}
                {%- endfor -%}
                {{- ns.l -}}
          - condition: template
            value_template: "{{ bericht | count > 0 }}"
          - repeat:
              for_each: "{{ ziele_alle }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: "🔧 Lüftung: Sensorbericht"
                    message: "{{ bericht | join('\n') }}"
                    data:
                      tag: lueftung_sensorbericht
                      push:
                        interruption-level: passive
          - if: "{{ web_ui }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: lueftung_sensorbericht
                  title: "🔧 Lüftung: Sensorbericht"
                  message: "{{ bericht | join('\n') }}"

      # ---------- Heimkehr: Abwesenheits-Warnung entfernen ----------
      - conditions:
          - condition: trigger
            id: heimkehr
        sequence:
          - repeat:
              for_each: "{{ ziele_alle }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    message: clear_notification
                    data:
                      tag: lueftung_abwesend
          - action: persistent_notification.dismiss
            data:
              notification_id: lueftung_abwesend

      # ---------- Erledigt: Liste still aktualisieren bzw. ✅ – Aufräumen immer auf allen Handys ----------
      - conditions:
          - condition: trigger
            id: erledigt
        sequence:
          - variables:
              raum: "{{ state_attr(trigger.entity_id, 'raum') or state_attr(trigger.entity_id, 'friendly_name') }}"
              von: "{{ trigger.from_state.state }}"
              nach: "{{ trigger.to_state.state }}"
              rest: >-
                {%- set ns = namespace(l=[]) -%}
                {%- for st in expand(sensoren) if st.state == 'schliessen' -%}
                  {%- set ns.l = ns.l + [(st.attributes.raum | default(st.name)) ~ ': ' ~ (st.attributes.grund | default(''))] -%}
                {%- endfor -%}
                {{- ns.l -}}
              empf_s: "{{ ziele_da if schliessen_nachts else ziele_wach }}"
              # „Schließen“ war mind. 100 s aktiv, also (vermutlich) verschickt
              schliessen_gemeldet: >-
                {{- von == 'schliessen' and (as_timestamp(now()) - as_timestamp(trigger.from_state.last_changed, 0)) >= 100 -}}
              # ✅ nur, wenn wirklich geschlossen (nicht: Fenster offen, aber kein Grund mehr zum Schließen)
              geschlossen_ok: "{{ bestaetigung and schliessen_gemeldet and nach in ['ok', 'lueften', 'dringend'] and empf_s | length > 0 }}"
              tags: >-
                {%- set t = [] -%}
                {%- if von == 'schliessen' and rest | length == 0 and not geschlossen_ok -%}
                  {%- set t = t + ['lueftung_schliessen'] -%}{%- endif -%}
                {%- if offen_alle | length == 0 -%}{%- set t = t + ['lueftung_wetter'] -%}{%- endif -%}
                {%- if offen_nachts | length == 0 -%}{%- set t = t + ['lueftung_nacht'] -%}{%- endif -%}
                {%- if not jemand_da and offene_fenster | length == 0 -%}{%- set t = t + ['lueftung_abwesend'] -%}{%- endif -%}
                {#- „Jetzt lüften“ hat sich ohne Lüften erledigt (bzw. ohne Bestätigung): aufräumen.
                    Wurde gelüftet, ersetzt die ✅-Nachricht sie nach ein paar Minuten. -#}
                {%- if von in ['lueften', 'dringend'] and bedarf.liste | length == 0
                      and (not bestaetigung or nach not in ['offen', 'schliessen']) -%}{%- set t = t + ['lueftung_bedarf'] -%}{%- endif -%}
                {{- t -}}
          - repeat:
              for_each: "{{ tags }}"
              sequence:
                - variables:
                    tag_aktuell: "{{ repeat.item }}"
                - action: persistent_notification.dismiss
                  data:
                    notification_id: "{{ tag_aktuell }}"
                - repeat:
                    for_each: "{{ ziele_alle }}"
                    sequence:
                      - action: "{{ repeat.item }}"
                        continue_on_error: true
                        data:
                          message: clear_notification
                          data:
                            tag: "{{ tag_aktuell }}"
          # Fenster geschlossen: Anwesende sehen ✅ bzw. die verbleibende Liste, alle anderen: Nachricht weg
          - if: "{{ geschlossen_ok or (schliessen_gemeldet and rest | length > 0) }}"
            then:
              - variables:
                  titel: >-
                    {{- '✅ Fenster geschlossen' if rest | length == 0
                        else ('🪟 Fenster schließen (' ~ rest | length ~ ')') -}}
                  text: >-
                    {%- if geschlossen_ok -%}✅ {{ raum }} geschlossen ({{ now().strftime('%H:%M') }}){%- endif -%}
                    {%- if rest | length > 0 -%}{{ '\n' if geschlossen_ok else '' }}Noch offen:{{ '\n' }}{{ rest | join('\n') }}{%- endif -%}
              - repeat:
                  for_each: "{{ ziele_alle }}"
                  sequence:
                    - if: "{{ repeat.item in empf_s }}"
                      then:
                        - action: "{{ repeat.item }}"
                          continue_on_error: true
                          data:
                            title: "{{ titel }}"
                            message: "{{ text }}"
                            data:
                              tag: lueftung_schliessen
                              push:
                                interruption-level: passive
                      else:
                        - if: "{{ rest | length == 0 }}"
                          then:
                            - action: "{{ repeat.item }}"
                              continue_on_error: true
                              data:
                                message: clear_notification
                                data:
                                  tag: lueftung_schliessen

      # ---------- Lüften begonnen: nach ein paar Minuten EINE ✅-Nachricht für alle geöffneten Räume ----------
      - conditions:
          - condition: trigger
            id: befolgt
          - "{{ bestaetigung }}"
          # nur frische Änderungen (nicht beim Neuladen/Neustart wiederhergestellte Werte)
          - >-
            {{ trigger.to_state is not none and trigger.to_state.attributes.erledigt_ts is number
               and trigger.from_state is not none
               and trigger.from_state.attributes.erledigt_ts | default(none) != trigger.to_state.attributes.erledigt_ts
               and as_timestamp(now()) - trigger.to_state.attributes.erledigt_ts < 180 }}
        sequence:
          - variables:
              eigen_ts: "{{ trigger.to_state.attributes.erledigt_ts }}"
          - delay:
              minutes: "{{ bestaetigung_min | int(5) }}"
          # Lage nach der Wartezeit neu lesen
          - variables:
              ziele_da: *ziele_da
              schlafend: *schlafend
              ziele_wach: *ziele_wach
              ziele_bedarf: *ziele_bedarf
              wetter_zustand: *wetter_zustand
              unwetter: *unwetter
              regen: *regen
              ruhezeit: *ruhezeit
              bedarf: *bedarf
              # Runde: Öffnungen, die höchstens (Wartezeit + 1 Min.) auseinanderliegen, vom neuesten rückwärts
              runde: >-
                {%- set luecke = (bestaetigung_min | int(5)) * 60 + 60 -%}
                {%- set ns = namespace(l=[]) -%}
                {%- for s in sensoren -%}
                  {%- set t = state_attr(s, 'erledigt_ts') -%}
                  {%- if t is number and t >= as_timestamp(now()) - 7200 -%}
                    {%- set g = state_attr(s, 'erledigt_grund') or '' -%}
                    {%- set ns.l = ns.l + [{'e': s, 't': t, 'raum': state_attr(s, 'raum') or state_attr(s, 'friendly_name'),
                          'min': state_attr(s, 'erledigt_min') or 0, 'dringend': g.startswith('dringend'),
                          'nur_g': g.startswith('Grundlüftung') and ' · ' not in g}] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set sortiert = ns.l | sort(attribute='t', reverse=true) -%}
                {%- set r = namespace(l=[], vorher=none, aus=false) -%}
                {%- for x in sortiert -%}
                  {%- if not r.aus and (r.vorher is none or r.vorher - x.t <= luecke) -%}
                    {%- set r.l = r.l + [x] -%}{%- set r.vorher = x.t -%}
                  {%- else -%}{%- set r.aus = true -%}{%- endif -%}
                {%- endfor -%}
                {#- Gleichstand: der Lauf mit der größten entity_id meldet -#}
                {%- set neueste = r.l | selectattr('t', 'eq', (r.l | map(attribute='t') | max) if r.l else 0) | map(attribute='e') | list -%}
                {{- {'raeume': r.l, 'letzt': (r.l[0].t if r.l else 0), 'melder': ((neueste | max) if neueste else '')} -}}
              # Wurde für diese Runde eine Aufforderung verschickt?
              gemeldet: >-
                {%- set zeit = as_timestamp(today_at(grundlueftung_zeit)) -%}
                {%- set ns = namespace(pflicht=false, grund=false) -%}
                {%- for r in runde.raeume -%}
                  {%- if not r.nur_g and (r.dringend or r.min >= (verzoegerung | int(0))) -%}{%- set ns.pflicht = true -%}
                  {%- elif r.nur_g and grundlueftung_meldung == 'sofort' and r.min >= (verzoegerung | int(0)) -%}{%- set ns.grund = true -%}
                  {%- elif r.nur_g and grundlueftung_meldung == 'mitnehmen_taeglich'
                        and (r.t - r.min * 60) < zeit <= r.t -%}{%- set ns.grund = true -%}
                  {%- endif -%}
                {%- endfor -%}
                {{- ns.pflicht or ns.grund -}}
          - condition: template
            value_template: >-
              {{ eigen_ts == runde.letzt and trigger.entity_id == runde.melder }}
          - variables:
              # noch offene Pflicht-Räume (stabil, wie bei „Jetzt lüften“), nicht in der Ruhezeit/bei Unwetter
              noch: >-
                {%- set ns = namespace(l=[], dringend=false) -%}
                {%- if not ruhezeit -%}
                  {%- for st in expand(sensoren) if st.state in ['lueften', 'dringend'] -%}
                    {%- set m = (as_timestamp(now()) - as_timestamp(st.last_changed, 0)) / 60 -%}
                    {%- if st.state == 'dringend' or m >= (verzoegerung | int(0)) -%}
                      {%- set ns.l = ns.l + [(st.attributes.raum | default(st.name)) ~ ': ' ~ (st.attributes.grund | default(''))] -%}
                      {%- if st.state == 'dringend' -%}{%- set ns.dringend = true -%}{%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endif -%}
                {{- {'l': ns.l if (not unwetter or ns.dringend) else [], 'dringend': ns.dringend} -}}
              mit: "{{ [] if (ruhezeit or noch.l | length == 0) else bedarf.mit }}"
              titel: "{{ '🪟 Noch zu lüften' if noch.l | length > 0 else '✅ Lüften begonnen' }}"
              text: >-
                {%- if gemeldet -%}✅ Fenster geöffnet: {{ runde.raeume | map(attribute='raum') | reverse | join(', ') }} ({{ now().strftime('%H:%M') }}){%- endif -%}
                {%- if noch.l | length > 0 %}{{ '\n' if gemeldet else '' }}Noch offen:{{ '\n' }}{{ noch.l | join('\n') }}{% endif %}
                {%- if mit | length > 0 %}{{ '\n' }}Bei der Gelegenheit auch: {{ mit | join(', ') }} (Grundlüftung){% endif %}
                {%- if noch.l | length > 0 and (regen or unwetter) %}{{ '\n' }}{{ '⛈ Unwetter' if unwetter else '🌧 Regen' }} – kurz stoßlüften.{% endif %}
          # Anwesende (wach) sehen ✅ bzw. was noch fehlt; alle anderen: Aufforderung entfernen.
          # Wurde nie etwas verschickt und steht nichts mehr an: nur aufräumen.
          - repeat:
              for_each: "{{ ziele_alle }}"
              sequence:
                - if: "{{ repeat.item in ziele_bedarf and (gemeldet or noch.l | length > 0) }}"
                  then:
                    - action: "{{ repeat.item }}"
                      continue_on_error: true
                      data:
                        title: "{{ titel }}"
                        message: "{{ text }}"
                        data:
                          tag: lueftung_bedarf
                          push:
                            interruption-level: "{{ 'time-sensitive' if noch.dringend and noch.l | length > 0 else 'passive' }}"
                  else:
                    - if: "{{ noch.l | length == 0 or repeat.item not in ziele_bedarf }}"
                      then:
                        - action: "{{ repeat.item }}"
                          continue_on_error: true
                          data:
                            message: clear_notification
                            data:
                              tag: lueftung_bedarf
