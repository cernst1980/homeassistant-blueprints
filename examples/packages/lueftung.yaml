# Beispiel-Package: config/packages/lueftung.yaml
# Einbinden in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# Entity-IDs anpassen. Die Status-Sensoren heißen sensor.luftung_<zone>
# (HA macht aus „Lüftung“ → „luftung“).

# ---------- Datenbank entlasten ----------
# Die Zonen-Sensoren schreiben jede Minute neue Attribute. Sie brauchen keine Historie,
# dafür gibt es unten sensor.lueftung_uebersicht. Hat configuration.yaml schon einen
# recorder:-Block mit exclude, die Zeile dort ergänzen und diesen Block löschen.
recorder:
  exclude:
    entity_globs:
      - sensor.luftung_*

# ---------- Optional: Mittelwert für offene Bereiche (mehrere Sensoren, eine Luft) ----------
sensor:
  - platform: group
    name: Erdgeschoss Mittel Temperatur
    unique_id: lueftung_eg_mittel_temperatur
    type: mean
    ignore_non_numeric: true
    device_class: temperature
    unit_of_measurement: "°C"
    state_class: measurement
    entities:
      - sensor.wohnzimmer_temperatur
      - sensor.esszimmer_temperatur
  - platform: group
    name: Erdgeschoss Mittel Luftfeuchtigkeit
    unique_id: lueftung_eg_mittel_luftfeuchtigkeit
    type: mean
    ignore_non_numeric: true
    device_class: humidity
    unit_of_measurement: "%"
    state_class: measurement
    entities:
      - sensor.wohnzimmer_luftfeuchtigkeit
      - sensor.esszimmer_luftfeuchtigkeit

# ---------- Optional: mehrere Außenöffnungen einer Zone ----------
binary_sensor:
  - platform: group
    name: Erdgeschoss Außenöffnungen
    unique_id: lueftung_eg_aussenoeffnungen
    device_class: window
    entities:
      - binary_sensor.terrassentuer
      - binary_sensor.fenster_kueche

template:
  # ---------- Außenwerte mit Rückfall auf den Wetterdienst (empfohlen) ----------
  # Fällt der Außensensor aus, laufen alle Zonen mit Wetterdienst-Werten weiter.
  # „quellen“ sorgt dafür, dass der Ausfall im Sensorbericht erscheint.
  - sensor:
      - name: Lüftung Außen Temperatur
        unique_id: lueftung_aussen_temperatur
        default_entity_id: sensor.lueftung_aussen_temperatur
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        state: >-
          {%- set v = states('sensor.aussen_temperatur') -%}
          {{ v | float if is_number(v) else state_attr('weather.forecast_home', 'temperature') }}
        availability: >-
          {{ is_number(states('sensor.aussen_temperatur')) or is_number(state_attr('weather.forecast_home', 'temperature')) }}
        attributes:
          quelle: "{{ 'Sensor' if is_number(states('sensor.aussen_temperatur')) else 'Wetterdienst' }}"
          quellen: "{{ ['sensor.aussen_temperatur'] }}"
      - name: Lüftung Außen Luftfeuchtigkeit
        unique_id: lueftung_aussen_luftfeuchtigkeit
        default_entity_id: sensor.lueftung_aussen_luftfeuchtigkeit
        device_class: humidity
        unit_of_measurement: "%"
        state_class: measurement
        state: >-
          {%- set v = states('sensor.aussen_luftfeuchtigkeit') -%}
          {{ v | float if is_number(v) else state_attr('weather.forecast_home', 'humidity') }}
        availability: >-
          {{ is_number(states('sensor.aussen_luftfeuchtigkeit')) or is_number(state_attr('weather.forecast_home', 'humidity')) }}
        attributes:
          quelle: "{{ 'Sensor' if is_number(states('sensor.aussen_luftfeuchtigkeit')) else 'Wetterdienst' }}"
          quellen: "{{ ['sensor.aussen_luftfeuchtigkeit'] }}"

  # ---------- Übersicht mit Historie ----------
  - sensor:
      - name: Lüftung Übersicht
        unique_id: lueftung_uebersicht
        default_entity_id: sensor.lueftung_uebersicht
        icon: mdi:home-thermometer-outline
        state: >-
          {{ ['sensor.luftung_bad', 'sensor.luftung_schlafzimmer', 'sensor.luftung_erdgeschoss']
             | select('is_state', ['lueften', 'dringend', 'schliessen']) | list | count }}
        attributes:
          bad: "{{ states('sensor.luftung_bad') }}"
          schlafzimmer: "{{ states('sensor.luftung_schlafzimmer') }}"
          erdgeschoss: "{{ states('sensor.luftung_erdgeschoss') }}"

  # ---------- Höchsttemperatur heute (Rest des Tages) aus der Vorhersage ----------
  - triggers:
      - trigger: time_pattern
        minutes: 5
      - trigger: homeassistant
        event: start
    actions:
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home
        data:
          type: hourly
        response_variable: fc
    sensor:
      - name: Wetter Höchstwert heute
        unique_id: wetter_hoechstwert_heute
        default_entity_id: sensor.wetter_hoechstwert_heute
        device_class: temperature
        unit_of_measurement: "°C"
        state: >-
          {%- set heute = now().date() -%}
          {%- set ns = namespace(t=[]) -%}
          {%- for f in fc['weather.forecast_home'].forecast -%}
            {%- if as_local(as_datetime(f.datetime)).date() == heute and f.temperature is number -%}
              {%- set ns.t = ns.t + [f.temperature] -%}
            {%- endif -%}
          {%- endfor -%}
          {{ (ns.t | max) if ns.t | length > 0 else none }}

  # ---------- Zonen ----------
  - use_blueprint:
      path: lueftung/lueftungsstatus_raum.yaml
      input:
        raum: Bad
        temp_innen: sensor.bad_temperatur
        feuchte_innen: sensor.bad_luftfeuchtigkeit
        fenster: binary_sensor.fenster_bad
        temp_aussen: sensor.lueftung_aussen_temperatur
        feuchte_aussen: sensor.lueftung_aussen_luftfeuchtigkeit
        tmax_heute: sensor.wetter_hoechstwert_heute
        # grundlueftung_ab: "09:00:00"                    # nicht vor der Duschzeit auskühlen
    name: Lüftung Bad
    unique_id: lueftung_bad

  - use_blueprint:
      path: lueftung/lueftungsstatus_raum.yaml
      input:
        raum: Schlafzimmer
        temp_innen: sensor.schlafzimmer_temperatur
        feuchte_innen: sensor.schlafzimmer_luftfeuchtigkeit
        co2: sensor.schlafzimmer_co2
        fenster: binary_sensor.fenster_schlafzimmer
        temp_aussen: sensor.lueftung_aussen_temperatur
        feuchte_aussen: sensor.lueftung_aussen_luftfeuchtigkeit
        tmax_heute: sensor.wetter_hoechstwert_heute
        # wand_temp: sensor.schlafzimmer_ecke_temperatur   # optional: kälteste Außenwandecke
        # f_rsi: 0.65                                       # Altbau; Neubau eher 0.8
        dauerlueften: "nachts"                              # nachts offen/gekippt erlaubt
        # kuehlen_ab: 22                                    # Sommer: Abkühlen ab 22 °C empfehlen
        nacht_beginn: "21:00:00"
        nacht_ende: "07:00:00"
        # regengeschuetzt: true                             # z. B. Vordach: keine Regenwarnung
    name: Lüftung Schlafzimmer
    unique_id: lueftung_schlafzimmer

  - use_blueprint:
      path: lueftung/lueftungsstatus_raum.yaml
      input:
        raum: Erdgeschoss
        temp_innen: sensor.erdgeschoss_mittel_temperatur
        feuchte_innen: sensor.erdgeschoss_mittel_luftfeuchtigkeit
        fenster: binary_sensor.erdgeschoss_aussenoffnungen
        temp_aussen: sensor.lueftung_aussen_temperatur
        feuchte_aussen: sensor.lueftung_aussen_luftfeuchtigkeit
        tmax_heute: sensor.wetter_hoechstwert_heute
        # dauerlueften: "immer"                             # Fenster darf offen bleiben …
        # dauer_fenster: [binary_sensor.fenster_kueche]     # … aber nur das Küchenfenster (Kochen)
        # dauer_max_min: 60
        # dauer_fenster_warm: [binary_sensor.terrassentuer] # Sommer: offen, solange wir draußen sitzen
        # dauer_ab_aussen: 18
        # temp_kuehlen: sensor.wintergarten_temperatur      # wärmster Raumteil bestimmt "Kühlen"
    name: Lüftung Erdgeschoss
    unique_id: lueftung_erdgeschoss

  # Heimkino: während eines Films nicht lüften (Lautstärke), danach nachholen
  # - use_blueprint:
  #     path: lueftung/lueftungsstatus_raum.yaml
  #     input:
  #       raum: Heimkino
  #       ...
  #       sperre: [media_player.beamer]
  #       sperre_zustaende: ["on", "playing", "paused"]
  #       sperre_name: Film

  # Keller: erdberührte Wände ≈ Raumtemperatur, kein Kühlen, strenger Sommer-Block
